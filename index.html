@font-face { font-family: "Oswald"; font-weight: 600; font-style: normal; font-display: swap;
  src: url("assets/oswald-latin-600-normal.woff2?v=1") format("woff2"); }
/* Raven Band palette: navy + gold (matches Agenda Board / Raven Band Hub) */
:root {
  color-scheme: light;
  --navy: #1f2a44; --navy-deep: #141c30; --gold: #c9a227; --gold-soft: #f6efd8;
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eef0f5;
  --line: #e1e4ec;
  --ink: #1b2233;
  --ink-2: #4f586b;
  --ink-3: #7c8496;
  --brand: #1f2a44;
  --brand-2: #34477a;
  --on-brand: #ffffff;
  --gold-ink: #8a6d12;
  --accent: #1f2a44;
  --accent-soft: #e8ecf5;
  --good: #1d7a4a;
  --good-soft: #e3f3ea;
  --bad: #b3372f;
  --bad-soft: #fbe7e5;
  --warn: #8a5a00;
  --warn-soft: #fdf3dc;
  --self: #eb6834;
  --tch: #2a78d6;
  --shadow: 0 1px 2px rgb(20 28 48 / 0.06), 0 4px 16px rgb(20 28 48 / 0.06);
  --r: 14px;
  --display: "Oswald", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --serif: var(--display);
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --navy: #141c30; --navy-deep: #0e1424; --gold-soft: #2c2816;
    --bg: #111827; --surface: #1b2335; --surface-2: #232d45; --line: #34405e;
    --ink: #f2f4f8; --ink-2: #b7bfd0; --ink-3: #8590a8;
    --brand: #c9a227; --brand-2: #e0bf55; --on-brand: #141c30; --gold-ink: #e0bf55;
    --accent: #c9a227; --accent-soft: #27304a;
    --good: #5cc28d; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1d1a; --warn: #f0c060; --warn-soft: #33290f;
    --self: #d95926; --tch: #3987e5;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --navy: #141c30; --navy-deep: #0e1424; --gold-soft: #2c2816;
  --bg: #111827; --surface: #1b2335; --surface-2: #232d45; --line: #34405e;
  --ink: #f2f4f8; --ink-2: #b7bfd0; --ink-3: #8590a8;
  --brand: #c9a227; --brand-2: #e0bf55; --on-brand: #141c30; --gold-ink: #e0bf55;
  --accent: #c9a227; --accent-soft: #27304a;
  --good: #5cc28d; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1d1a; --warn: #f0c060; --warn-soft: #33290f;
  --self: #d95926; --tch: #3987e5;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); min-height: 100vh; overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--ink-2); }
.small { font-size: 0.86rem; }
.tiny { font-size: 0.78rem; }
.center { text-align: center; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: 0.01em; }

/* topbar — navy with a gold rule, like the Raven Band pages */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--navy); color: #fff; border-bottom: 3px solid var(--gold); }
.tb-home { border: 0; background: none; padding: 0; color: var(--gold); width: 36px; height: 36px; flex: none; }
.tb-home svg { width: 36px; height: 36px; display: block; }
.tb-mid { flex: 1; min-width: 0; }
.tb-brand { font-family: var(--display); font-weight: 600; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.06em; }
.tb-student { font-family: var(--display); font-weight: 600; font-size: 1.1rem; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-meta { font-size: 0.8rem; color: rgb(255 255 255 / 0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-total { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb-score { font-family: var(--display); font-size: 1.6rem; font-weight: 600; color: var(--gold); }
.tb-max { color: rgb(255 255 255 / 0.6); margin-left: 3px; }
.tb-icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgb(255 255 255 / 0.22); background: rgb(255 255 255 / 0.06); display: grid; place-items: center; flex: none; color: #fff; }
.tb-icon:hover { border-color: var(--gold); }
.tb-icon svg { width: 20px; height: 20px; }
.tb-icon.live { color: var(--navy); background: var(--gold); border-color: var(--gold); }

main { padding-top: 20px; padding-bottom: 40px; }
.foot { color: var(--ink-3); font-size: 0.78rem; text-align: center; padding-bottom: 28px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 0.9rem; }
.btn.big { min-height: 54px; font-size: 1.08rem; padding: 10px 24px; }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.back { border: 0; background: none; color: var(--brand-2); font-weight: 600; padding: 6px 0; margin-bottom: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; font-weight: 600; min-height: 34px; }

/* home */
.hero-band { position: relative; width: 100vw; margin: -20px calc(50% - 50vw) 0; background: var(--navy); color: #fff; overflow: hidden; }
.hero-band::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(900px 400px at 85% 10%, rgb(201 162 39 / 0.18), transparent 60%),
  repeating-linear-gradient(0deg, transparent 0 23px, rgb(255 255 255 / 0.035) 23px 24px); pointer-events: none; }
.hero-in { position: relative; max-width: 980px; margin: 0 auto; padding: 44px 16px 52px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; align-items: center; }
.eyebrow { font-family: var(--display); color: var(--gold); text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.9rem; margin-bottom: 10px; }
.hero-band h1 { font-size: clamp(2.3rem, 5.4vw, 4rem); text-transform: uppercase; line-height: 1.02; letter-spacing: 0.01em; }
.hero-band h1 em { font-style: normal; color: var(--gold); }
.hero-band p { color: rgb(255 255 255 / 0.82); max-width: 52ch; margin: 16px 0 22px; font-size: 1.05rem; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #141c30; font-weight: 700; }
.btn.gold:hover { filter: brightness(1.06); }
.btn.on-navy { background: transparent; color: #fff; border-color: rgb(255 255 255 / 0.35); }
.btn.on-navy:hover { border-color: var(--gold); }
/* mini judge sheet */
.mini { justify-self: center; width: min(360px, 100%); background: #fdfcf8; color: #1b1a18; border-radius: 6px; padding: 18px 18px 14px; transform: rotate(2.5deg);
  box-shadow: 0 30px 60px -20px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(0 0 0 / 0.04); font: 12px/1.35 "Times New Roman", Times, serif; position: relative; }
.mini::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -10px; height: 10px; background: #e9e6dd; border-radius: 0 0 6px 6px; z-index: -1; transform: rotate(-3deg); }
.mini-t { text-align: center; font-weight: 700; font-size: 13px; }
.mini-s { text-align: center; font-size: 11px; margin-bottom: 8px; }
.mini-info { display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding-bottom: 3px; margin-bottom: 8px; font-size: 11px; }
.mini-info b { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; color: #1f3a8a; font-weight: 400; font-size: 13px; }
.mini table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.mini td, .mini th { border: 1px solid #333; text-align: center; padding: 2px 3px; font-size: 11px; }
.mini th { background: #eee; font-weight: 700; }
.mini .ck { color: #1d7a4a; font-weight: 700; font-family: var(--sans); }
.mini .xx { color: #b3372f; font-weight: 700; font-family: var(--sans); }
.mini-rub { display: grid; grid-template-columns: 92px 1fr; gap: 3px 6px; font-size: 11px; margin-bottom: 8px; }
.mini-rub span:nth-child(even) { color: #777; letter-spacing: 0.5px; white-space: nowrap; }
.mini-rub i { font-style: normal; color: #000; border: 1.5px solid #1f3a8a; border-radius: 50%; padding: 0 3px; }
.mini-tot { border-top: 2px solid #000; padding-top: 5px; display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
.mini-tot b { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; color: #1f3a8a; font-size: 20px; font-weight: 400; }
.stamp { position: absolute; top: -16px; right: -18px; transform: rotate(12deg); border: 3px solid var(--gold); color: var(--gold); font-family: var(--display); font-size: 22px; letter-spacing: 0.12em; padding: 2px 10px; border-radius: 6px; background: rgb(253 252 248 / 0.75); }
/* home sections */
.home-sec { margin-top: 30px; }
.sec-label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.95rem; color: var(--gold-ink); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.continue { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cont { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.cont:hover { border-color: var(--gold); }
.cont.resume { border-left: 4px solid var(--gold); }
.cont-k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-ink); font-weight: 700; }
.cont-n { font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.02em; }
.cont-v { color: var(--ink-2); font-size: 0.86rem; }
.grade-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.gcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .15s, border-color .15s, box-shadow .15s; }
.gcard:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 14px 30px -14px rgb(20 28 48 / 0.35); }
.gcard-top { background: var(--navy); color: #fff; padding: 16px 18px 14px; border-bottom: 3px solid var(--gold); }
.gnum { font-family: var(--display); font-size: 3.2rem; line-height: 0.95; color: var(--gold); letter-spacing: 0.01em; }
.gnum small { font-size: 0.9rem; letter-spacing: 0.14em; color: rgb(255 255 255 / 0.7); display: block; margin-bottom: 4px; }
.gname { font-family: var(--display); font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; }
.gcard ul { list-style: none; margin: 0; padding: 14px 18px 16px; display: grid; gap: 6px; font-size: 0.92rem; color: var(--ink-2); }
.gcard li { display: flex; gap: 8px; }
.gcard .nw { white-space: nowrap; }
.gcard li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-top: 0.55em; }
.gcard .go { margin-top: auto; padding: 10px 18px 14px; font-weight: 700; color: var(--brand-2); }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; counter-reset: how; }
.how > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.how svg { width: 44px; height: 44px; padding: 9px; border-radius: 12px; background: var(--navy); color: var(--gold); }
.how h3 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.04em; }
.how h3::before { counter-increment: how; content: counter(how) ". "; color: var(--gold-ink); }
.how p { margin: 4px 0 0; color: var(--ink-2); font-size: 0.9rem; }
.home-help { margin-top: 18px; text-align: center; }
.credit { color: var(--ink-3); }
.credit b { color: var(--gold-ink); font-weight: 600; }
@media (max-width: 860px) {
  .hero-in { grid-template-columns: 1fr; padding: 32px 20px 36px; gap: 0; }
  .mini { display: none; }
  .grade-cards, .how { grid-template-columns: 1fr; }
  .gcard-top { display: flex; align-items: flex-end; gap: 14px; }
  .gnum { font-size: 2.6rem; }
  .gname { margin: 0 0 4px; }
}
.steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 18px 0 14px; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-3); padding-right: 10px; }
.steps li span { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 0.75rem; }
.steps li.done { color: var(--ink-2); }
.steps li.done span { background: var(--surface-2); }
.steps li.cur { color: var(--ink); font-weight: 700; }
.steps li.cur span { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.pick-h { font-size: 1.55rem; margin: 6px 0 14px; text-transform: uppercase; letter-spacing: 0.03em; }
.fam { font-family: var(--sans); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 18px 0 8px; }
.cards { display: grid; gap: 12px; }
.cards.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.cards.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.cards.inst { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pick { text-align: left; padding: 18px; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, transform .15s; }
.pick:hover { border-color: var(--gold); transform: translateY(-1px); }
.pick.sm { padding: 14px; min-height: 56px; justify-content: center; }
.pick-g { font-size: 0.8rem; font-weight: 700; color: var(--gold-ink); text-transform: uppercase; letter-spacing: 0.06em; }
.pick-t { font-family: var(--display); font-size: 1.4rem; font-weight: 600; letter-spacing: 0.02em; }
.pick.sm .pick-t { font-size: 1.05rem; font-family: var(--sans); font-weight: 600; }
.pick-s { font-size: 0.86rem; color: var(--ink-2); }
.pick.round ul { margin: 6px 0 8px; padding-left: 18px; color: var(--ink-2); font-size: 0.92rem; }
.nag { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); padding: 12px 14px; border-radius: 12px; margin: 10px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 0.92rem; }
.variant { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; color: var(--ink-2); font-size: 0.92rem; }

/* segmented */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg.wrap { flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 0.9rem; color: var(--ink-2); min-height: 38px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* setup */
.formcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.sheet-id { display: flex; flex-direction: column; margin-bottom: 14px; }
.sheet-id strong { font-family: var(--display); font-weight: 600; font-size: 1.2rem; letter-spacing: 0.02em; }
.sheet-id span { color: var(--ink-2); font-size: 0.9rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 0.86rem; color: var(--ink-2); font-weight: 600; }
.fld.wide { grid-column: 1 / -1; }
.fld input, .fld select { min-height: 46px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-weight: 400; font-size: 1rem; }
.fld input:focus, .fld select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.flow { border: 0; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.flow legend { font-weight: 700; margin-bottom: 8px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.radio.on { border-color: var(--brand-2); background: var(--accent-soft); }
.radio input { margin-top: 4px; accent-color: var(--brand); width: 18px; height: 18px; }
.radio span { display: flex; flex-direction: column; }
.radio small { color: var(--ink-2); font-size: 0.86rem; }
details.tips { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
details.tips summary { font-weight: 700; cursor: pointer; }
details.tips ul, .modal ul { padding-left: 18px; }
details.tips li, .modal li { margin: 6px 0; }

/* sheet */
.sheet-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 10px; }
.sheet-head .sheet-id { margin: 0; }
.banner { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 0.93rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.banner.self { background: color-mix(in srgb, var(--self) 14%, var(--surface)); border-color: color-mix(in srgb, var(--self) 40%, transparent); }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.group-h { font-size: 1.4rem; margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 3px solid var(--gold); text-transform: uppercase; letter-spacing: 0.05em; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sec-h h3 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.04em; padding-left: 10px; border-left: 4px solid var(--gold); }
.sec-score { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.sec-score span { font-family: var(--display); font-weight: 600; color: var(--ink); font-size: 1.4rem; }
.progress { height: 3px; background: var(--surface-2); border-radius: 3px; margin: 8px 0 10px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.help { color: var(--ink-2); font-size: 0.88rem; margin: 0 0 10px; }
.help.practice { font-style: italic; }
.sec-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

.item { padding: 10px 0; border-top: 1px dashed var(--line); }
.item:first-child { border-top: 0; }
.item-h { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
.val { font-variant-numeric: tabular-nums; font-weight: 800; }
.val small { color: var(--ink-3); font-weight: 400; }
.scale-chips { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.sc { min-height: 42px; min-width: 0; padding: 0 2px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.sc:hover { border-color: var(--ink-3); }
.sc.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.sc.nudge { background: var(--surface-2); color: var(--brand-2); }
.slider { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.slider .ticks { grid-column: 2; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--ink-3); margin-top: -4px; }
.slider input[type=range] { width: 100%; accent-color: var(--brand); height: 32px; }
.slider.unset input[type=range] { opacity: 0.45; }

/* wind scale rows */
.srow { display: grid; grid-template-columns: minmax(72px, 0.9fr) auto auto auto 52px auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.srow:first-child { border-top: 0; }
.skey { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 5px; }
.skey b { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.skey small { color: var(--ink-2); }
.oct { font-size: 0.72rem; color: var(--ink-3); width: 100%; }
.cg { display: flex; align-items: center; gap: 4px; }
.cg > span { font-size: 0.72rem; color: var(--ink-3); width: 30px; text-align: right; margin-right: 2px; }
.cell { width: 44px; height: 44px; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--bg); font-weight: 700; color: var(--ink-3); font-size: 0.95rem; }
.cell.ok { border: 1.5px solid var(--good); background: var(--good-soft); color: var(--good); }
.cell.no { border: 1.5px solid var(--bad); background: var(--bad-soft); color: var(--bad); }
.stot { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.stot small { color: var(--ink-3); font-weight: 400; }
.rowbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 0.8rem; padding: 6px 8px; min-height: 36px; white-space: nowrap; }
.factor { margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.mrow { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.mrow:first-child { border-top: 0; }
.mcol .lbl { font-size: 0.74rem; color: var(--ink-3); display: block; margin-bottom: 3px; }

.cmt-wrap { margin-top: 10px; }
.cmt-wrap summary { cursor: pointer; font-weight: 600; color: var(--brand-2); font-size: 0.92rem; padding: 4px 0; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.qc { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: 0.82rem; min-height: 34px; }
.qc:hover { border-color: var(--brand-2); }
textarea.cmt { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); resize: vertical; font-size: 0.98rem; }
.sheet-foot { display: flex; justify-content: flex-end; margin-top: 18px; }

/* results */
.res-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 6px 0 14px; border-bottom: 3px solid var(--gold); margin-bottom: 14px; }
.res-name { font-family: var(--display); font-size: 2.3rem; font-weight: 600; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
.res-meta { color: var(--ink-2); font-size: 0.92rem; margin-top: 4px; }
.res-total { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.res-total .big { font-family: var(--display); font-size: 3.6rem; font-weight: 600; line-height: 1; color: var(--brand); }
.res-total .of { color: var(--ink-3); font-size: 1.2rem; }
.res-total .pc { margin-left: 8px; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-weight: 700; color: var(--ink-2); }
.res-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.res-grid .panel { margin: 0; }
.res-grid + .res-grid { margin-top: 12px; }
.panel h3 { font-size: 1.15rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.panel h4 { font-family: var(--sans); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 14px 0 6px; }
.panel.good { border-top: 4px solid var(--good); }
.panel.focus { border-top: 4px solid var(--warn); }
.cut .cut-msg { font-size: 1.05rem; }
.cut.above .cut-msg b { color: var(--good); }
.cut.below .cut-msg b { color: var(--bad); }
.gauge { position: relative; height: 14px; background: var(--surface-2); border-radius: 7px; margin: 30px 0 8px; }
.gauge i { display: block; height: 100%; border-radius: 7px; background: var(--accent); }
.gauge .mark { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--ink); }
.gauge .mark em { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 0.75rem; font-weight: 700; white-space: nowrap; margin-bottom: 2px; }
.bar { margin: 10px 0; }
.bar-l { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; }
.bar-l b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-t { height: 8px; background: var(--surface-2); border-radius: 4px; margin-top: 4px; overflow: hidden; }
.bar-t i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.lost { margin: 0; padding-left: 20px; }
.lost li { margin: 6px 0; }
.lost li { display: list-item; }
.lost li span { display: inline-block; min-width: 60%; }
.lost li b { color: var(--bad); font-variant-numeric: tabular-nums; float: right; }
.miss { margin: 0; padding-left: 18px; font-size: 0.92rem; }
.miss li { margin: 4px 0; }
.cat { padding: 8px 0; border-top: 1px dashed var(--line); }
.cat:first-of-type { border-top: 0; }
.cat-h { display: flex; justify-content: space-between; }
.cat-h span { font-weight: 800; font-variant-numeric: tabular-nums; }
.cat-ctx { font-size: 0.82rem; color: var(--ink-3); }
.insight { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; margin: 10px 0 0; }
.plan { list-style: none; padding: 0; margin: 0; counter-reset: p; }
.plan li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); }
.plan li:first-child { border-top: 0; }
.plan .min { font-weight: 800; color: var(--brand-2); font-variant-numeric: tabular-nums; }
.plan b { display: block; }
.plan span { color: var(--ink-2); font-size: 0.92rem; }
.cmp-sum { margin: 0 0 8px; }
.cmp-legend { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-2); margin-bottom: 6px; }
.cmp-legend .k { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-left: 8px; }
.cmp-legend .k.self { background: var(--self); }
.cmp-legend .k.tch { background: var(--tch); }
.cmp-row { display: grid; grid-template-columns: minmax(130px, 1fr) 1.4fr; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.cmp-row.flag .cmp-l { font-weight: 700; }
.cmp-l { font-size: 0.88rem; }
.cmp-l em { display: block; font-style: normal; font-size: 0.75rem; color: var(--warn); font-weight: 700; }
.cmp-bars { display: grid; gap: 3px; }
.cb { display: grid; grid-template-columns: 1fr 36px; align-items: center; gap: 6px; }
.cb i { display: block; height: 8px; border-radius: 0 4px 4px 0; min-width: 2px; }
.cb.self i { background: var(--self); }
.cb.tch i { background: var(--tch); }
.cb span { font-size: 0.78rem; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cmt-block p { margin: 0 0 8px; }
.cmt-block ul { margin: 0; padding-left: 18px; }

/* history */
.hist { display: grid; grid-template-columns: 220px 1fr; gap: 14px; }
.hist-list { display: flex; flex-direction: column; gap: 6px; }
.hist-st { text-align: left; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; display: flex; flex-direction: column; }
.hist-st span { font-size: 0.8rem; color: var(--ink-3); }
.hist-st.on { border-color: var(--brand-2); background: var(--accent-soft); }
.hist-main { min-width: 0; }
.combo { font-weight: 700; margin-bottom: 8px; }
.chart-wrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; margin: 10px 0; }
#hchart svg { width: 100%; height: auto; display: block; }
#hchart .g { stroke: var(--line); stroke-width: 1; }
#hchart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); }
#hchart .cutl { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
#hchart .cutt { fill: var(--ink-2); font-weight: 600; }
#hchart .ln { fill: none; stroke: var(--tch); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
#hchart .dot { fill: var(--tch); stroke: var(--surface); stroke-width: 2; }
#hchart .hit { fill: transparent; cursor: pointer; }
#hchart .lbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--sans); }
.htip { position: absolute; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 0.82rem; pointer-events: none; display: flex; flex-direction: column; white-space: nowrap; }
.htable { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.htable th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px; border-bottom: 1px solid var(--line); }
.htable td { padding: 8px 6px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
.htable .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.htable .num small { display: block; font-size: 0.75rem; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.htable .acts { text-align: right; white-space: nowrap; }
.htable .acts .btn { margin-left: 4px; }
.hist-io { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

/* tools panel */
.tools { position: fixed; right: 12px; top: 64px; z-index: 40; width: min(320px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 40px rgb(0 0 0 / 0.18); padding: 12px 14px; }
.tools-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.tool { padding: 10px 0; border-top: 1px solid var(--line); }
.tool-l { font-weight: 700; font-size: 0.9rem; }
.t-time { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.t-time.over { color: var(--bad); }
.tool-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.bpm { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
.x { border: 0; background: none; font-size: 1.1rem; color: var(--ink-2); width: 36px; height: 36px; border-radius: 8px; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.45); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-card { position: relative; background: var(--surface); border-radius: var(--r); max-width: 620px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 22px; }
.modal-card > .x { position: absolute; top: 10px; right: 10px; }
.modal h3 { font-size: 1.3rem; margin: 0 40px 8px 0; }
.modal h4 { margin: 16px 0 6px; }
.share-opts { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; font-size: 0.92rem; }
.share-opts input { accent-color: var(--brand); }
.share-url { display: flex; gap: 8px; }
.share-url input { flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); font-size: 0.85rem; }
.qr { display: flex; align-items: center; gap: 14px; margin: 14px 0; }
.qr svg { width: 150px; height: 150px; background: #fff; border-radius: 8px; flex: none; }
.qr span { color: var(--ink-2); font-size: 0.88rem; }
.calib { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.calib th { text-align: left; white-space: nowrap; padding: 6px 10px 6px 0; vertical-align: top; }
.calib td { padding: 6px 0; color: var(--ink-2); }
.calib tr { border-top: 1px dashed var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; transition: all .2s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* blank-box helpers */
.banner.blanks { flex-direction: column; align-items: flex-start; }
.banner-acts { display: flex; gap: 8px; flex-wrap: wrap; }
@keyframes flash { 0%, 60% { background: var(--warn-soft); box-shadow: 0 0 0 3px var(--warn); } 100% { background: transparent; box-shadow: none; } }
.flash { animation: flash 2.4s ease-out; border-radius: 10px; }
.cell.flash-cell { border-color: var(--warn); border-style: solid; }

/* responsive */
@media (max-width: 720px) {
  .hist { grid-template-columns: 1fr; }
  .hist-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .hist-st { flex: none; }
  .srow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 12px; }
  .srow .skey { order: 0; flex: 1 0 calc(100% - 140px); flex-wrap: nowrap; align-self: center; }
  .srow .rowbtn { order: 1; align-self: center; }
  .srow .stot { order: 2; min-width: 40px; align-self: center; }
  .srow .cg { order: 3; position: relative; padding-top: 16px; flex-wrap: nowrap; }
  .srow .cg > span { position: absolute; top: 0; left: 0; width: auto; text-align: left; margin: 0; }
  .cell { width: 42px; height: 42px; }
  .oct { width: auto; margin-left: 6px; }
  .mrow { grid-template-columns: 1fr; gap: 6px; }
  .res-total .big { font-size: 2.4rem; }
  .res-name { font-size: 1.6rem; }
  .cmp-row { grid-template-columns: 1fr; gap: 4px; }
  .tb-total .tb-max { display: none; }
}
@media (max-width: 400px) {
  .cell { width: 38px; height: 40px; }
  .cg { gap: 3px; }
}
@media (max-width: 520px) {
  /* wrap long chip rows into two rows of 6 so every target stays finger-sized */
  .scale-chips { grid-auto-flow: row; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .mcol .scale-chips { grid-template-columns: repeat(5, 1fr); }
  .sc { min-height: 42px; }
}

/* ===================== PRINT ===================== */
.print { display: none; }
@media print {
  @page { size: letter; margin: 0.45in; }
  body { background: #fff; color: #000; }
  .topbar, #main, .foot, .tools, .modal, .toast { display: none !important; }
  .print { display: block; font: 10.5pt/1.35 "Times New Roman", Times, serif; color: #000; }
  .p-page { page-break-after: always; }
  .p-page:last-child { page-break-after: auto; }
  .p-mock { text-align: right; font: 700 8pt Arial, sans-serif; letter-spacing: 0.08em; color: #555; }
  .p-title { text-align: center; font-size: 14pt; font-weight: 700; }
  .p-sub { text-align: center; font-size: 12pt; font-weight: 700; margin-bottom: 4px; }
  .p-div { text-align: center; font-size: 10pt; }
  .p-info { width: 100%; border-collapse: collapse; margin: 6px 0 8px; }
  .p-info td { padding: 2px 4px; border-bottom: 1px solid #000; }
  .p-group { font-size: 12pt; margin: 10px 0 2px; border-bottom: 1.5px solid #000; font-family: inherit; }
  .p-group span { font-weight: 400; font-size: 10pt; }
  .p-sec { margin: 6px 0; break-inside: avoid; }
  .p-sech { font-weight: 700; display: flex; justify-content: space-between; }
  .p-tot { font-weight: 400; }
  .p-scales { width: 100%; border-collapse: collapse; margin: 3px 0; }
  .p-scales th, .p-scales td { border: 1px solid #000; padding: 1px 6px; text-align: center; font-size: 9.5pt; }
  .p-scales th { background: #eee; }
  .p-calc { text-align: right; font-size: 9.5pt; }
  .p-rub { width: 100%; border-collapse: collapse; }
  .p-rub td { padding: 0 4px; font-size: 9.5pt; }
  .p-rub td:first-child { width: 30%; }
  .p-rub i { font-style: normal; color: #888; letter-spacing: 1px; }
  .circ { border: 1.5px solid #000; border-radius: 50%; padding: 0 4px; }
  .p-mallet { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 9.5pt; }
  .p-note { font-size: 8.5pt; font-style: italic; color: #444; }
  .p-total { margin-top: 10px; font-size: 13pt; text-align: right; border-top: 2px solid #000; padding-top: 6px; }
  .p-total span { display: block; font-size: 9pt; }
  .p-big { text-align: center; font-size: 22pt; font-weight: 700; margin: 10px 0; }
  .p-big span { display: block; font-size: 10pt; font-weight: 400; }
  .p-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .print h4 { font-size: 11pt; margin: 10px 0 2px; }
  .print ul, .print ol { margin: 2px 0; padding-left: 18px; }
  .p-foot { margin-top: 16px; font-size: 8pt; color: #555; text-align: center; }
}

/* ===================== SIGHT READING (First Sight) ===================== */
@font-face { font-family: "GN Music"; src: url("vendor/first-sight/music.woff2?v=1") format("woff2"); font-display: block; }
.fs-box { border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; background: var(--surface-2); }
.fs-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.fs-h b { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.fs-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-ink); border: 1px solid var(--gold); border-radius: 999px; padding: 1px 8px; font-weight: 700; }
.fs-code { font: 700 0.85rem/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; padding: 4px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.fs-code.light { background: rgb(255 255 255 / 0.08); color: #fff; border-color: rgb(255 255 255 / 0.25); }
.fs-meta { font-size: 0.88rem; color: var(--ink-2); margin-bottom: 8px; }
.fs-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 8px 0 10px; }
.fs-opts .fld select { min-height: 42px; }
.fs-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.fs-codeform { display: flex; gap: 6px; align-items: center; flex: 1 1 240px; }
.fs-codeform input { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--bg); text-transform: uppercase; letter-spacing: 0.08em; font-family: ui-monospace, Menlo, Consolas, monospace; }
/* music is always black on paper, even in dark mode (it's sheet music on a stand) */
.fs-paper { --ink: #18203a; color: #18203a; background: #fff; border-radius: 8px; padding: 8px 10px; }
.fs-preview { border: 1px solid var(--line); min-height: 60px; }
.fs-tempo { margin: 0 0 2px 6px; font: 16px/1.2 Georgia, "Times New Roman", serif; }
.fs-tempo b { font-weight: 700; }
.fs-q { display: inline-block; height: 1.15em; width: auto; vertical-align: -0.2em; }
.fs-rows { display: flex; flex-direction: column; gap: 2px; }
.fs-row { position: relative; }
.fs-row svg { display: block; width: 100%; height: auto; }
.fs-rows .halo { transition: opacity .08s; }
.fs-rows g.fs-on .halo { opacity: .9; fill: #c9a227; fill-opacity: .5; stroke: #8a6d12; stroke-width: 2; }
.fs-marker { position: absolute; top: 8%; bottom: 8%; width: 14px; margin-left: -7px; border-radius: 7px; background: #2a78d6; opacity: .25; pointer-events: none; }
.fs-res { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.fs-res:first-of-type { border-top: 0; }
.fs-res .fs-code { margin-left: 8px; }

/* the music stand: full screen, navy frame, white paper */
body.stand-open { overflow: hidden; }
.stand { position: fixed; inset: 0; z-index: 45; background: var(--navy-deep); color: #fff; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom)); gap: 10px; }
.stand-top { display: flex; align-items: center; gap: 12px; }
.stand-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stand-t b { font-family: var(--display); font-weight: 600; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); }
.stand-t span { font-size: 0.85rem; color: rgb(255 255 255 / 0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stand-paper { position: relative; flex: 1; overflow: auto; padding: 18px 22px; border-radius: 10px; box-shadow: 0 10px 40px rgb(0 0 0 / .4); }
/* the audition sequence: the music is covered (face down) until the study clock starts */
.stand-cover { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 20px; border-radius: 10px; color: #fff;
  background: radial-gradient(700px 300px at 50% 0%, rgb(201 162 39 / .16), transparent 70%), var(--navy); overflow: auto; }
.cover-in { max-width: 720px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.cover-k { font-family: var(--display); text-transform: uppercase; letter-spacing: .16em; color: var(--gold); font-size: .95rem; }
.stand-cover blockquote { margin: 0; font: 600 clamp(1.3rem, 3.2vw, 2.1rem)/1.35 Georgia, "Times New Roman", serif; }
.cover-help { margin: 0; color: rgb(255 255 255 / .75); font-size: .95rem; min-height: 1.4em; }
.cover-speak { display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; color: rgb(255 255 255 / .9); cursor: pointer; }
.cover-speak input { width: 20px; height: 20px; accent-color: var(--gold); }
.stand-cover blockquote.speaking { color: var(--gold); transition: color .3s; }
.fs-ticks { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.fs-ticks i { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 600 1rem var(--display); font-style: normal;
  border: 2px solid rgb(255 255 255 / .35); color: rgb(255 255 255 / .6); transition: background .08s, transform .08s; }
.fs-ticks i.on { background: var(--gold); border-color: var(--gold); color: #141c30; }
.fs-ticks i.now { transform: scale(1.18); }
.fs-ticks.big { grid-area: ticks; justify-content: flex-start; }
@media (max-width: 520px) { .fs-ticks i { width: 32px; height: 32px; } .fs-ticks { gap: 6px; } }
.stand-paper .fs-tempo { font-size: 20px; }
.stand-paper .fs-rows { gap: 14px; max-width: 1400px; margin: 0 auto; }
.stand-study { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; }
.stand-study p { margin: 0; color: rgb(255 255 255 / .85); }
.stand-study b { font-family: var(--display); font-size: 1.6rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.fs-study-bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: rgb(255 255 255 / .12); overflow: hidden; }
.fs-study-bar i { display: block; height: 100%; background: var(--gold); transform-origin: left; transition: transform .2s linear; }
.stand-ctl { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "say btns" "ticks btns" "opts btns"; gap: 6px 14px; align-items: center; }
.fs-say { grid-area: say; margin: 0; min-height: 1.4em; font-size: 1.05rem; }
.stand-btns { grid-area: btns; display: flex; gap: 8px; }
.stand-btns .btn { min-width: 170px; }
.stand .btn:not(.primary):not(.gold) { background: rgb(255 255 255 / .06); color: #fff; border-color: rgb(255 255 255 / .3); }
.stand .btn.primary { background: var(--gold); border-color: var(--gold); color: #141c30; }
.stand #fs-hear.locked { opacity: .6; }
.stand-opts { grid-area: opts; display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; font-size: 0.9rem; color: rgb(255 255 255 / .8); }
.fs-tempo-ctl { display: inline-flex; align-items: center; gap: 6px; }
.fs-tempo-ctl .btn { min-width: 36px; padding: 0; }
#fs-bpm { min-width: 4.5em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.fs-tg { display: inline-flex; align-items: center; gap: 6px; }
.fs-tg select { background: rgb(255 255 255 / .08); color: #fff; border: 1px solid rgb(255 255 255 / .3); border-radius: 8px; padding: 4px 6px; }
.fs-tg select option { color: #000; }
.fs-tg input { accent-color: var(--gold); width: 18px; height: 18px; }
.stand.running .stand-opts > :not([data-act=fsrestart]) { opacity: .5; pointer-events: none; }  /* settings lock mid-sequence; Start over stays usable */
@media (max-width: 720px) {
  .stand-ctl { grid-template-columns: 1fr; grid-template-areas: "say" "ticks" "btns" "opts"; }
  .stand-btns .btn { flex: 1; min-width: 0; }
  .stand-paper { padding: 10px; }
  .stand-top .fs-code { display: none; }
}
@media print {
  .stand { display: none !important; }
  .fs-print .fs-paper { padding: 0; }
  .fs-print .fs-row { break-inside: avoid; margin-bottom: 12px; }
  .fs-print .fs-tempo { font-size: 13pt; }
}

/* ===================== v2: quick checks, audition day, goals, recording ===================== */
.chip-btn.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.quick-pick { margin-top: 22px; }
.qrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.qrow-l { font-weight: 700; min-width: 110px; font-size: .92rem; }
.qrow .chip-btn { min-height: 40px; padding: 6px 14px; }
.quick-banner { background: var(--gold-soft); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.quick-tag { color: var(--gold-ink); font-weight: 700; }
.ways { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.way { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; box-shadow: var(--shadow); }
button.way:hover { border-color: var(--gold); }
.way svg { width: 44px; height: 44px; padding: 9px; border-radius: 12px; background: var(--navy); color: var(--gold); }
.way h3 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: .04em; }
.way p { margin: 4px 0 0; color: var(--ink-2); font-size: .9rem; }
@media (max-width: 860px) { .ways { grid-template-columns: 1fr; } }

/* audition day */
.sess-form .fld > span { margin-bottom: 4px; }
.sess-form .fld > .seg { align-self: flex-start; }
@media (max-width: 720px) { .sess-bar { position: static; } .sess-nav { width: 100%; } .sess-nav select { flex: 1; max-width: none; } }
.chip-btn .fs-q { height: 1.1em; vertical-align: -0.2em; margin-right: 1px; }
.sess-form > .fld { margin-bottom: 14px; }
.sess-form textarea { min-height: 160px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: inherit; resize: vertical; }
.check { display: flex; gap: 10px; align-items: center; margin: 12px 0 18px; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }
.sess-bar { position: sticky; top: 59px; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--navy); color: #fff; border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; border-bottom: 3px solid var(--gold); }
.sess-info { display: flex; flex-direction: column; }
.sess-k { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-weight: 700; }
.sess-info b { font-family: var(--display); font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; }
.sess-nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sess-nav select { min-height: 36px; border-radius: 8px; border: 1px solid rgb(255 255 255 / .3); background: rgb(255 255 255 / .08); color: #fff; padding: 4px 8px; max-width: 200px; }
.sess-nav select option { color: #000; }
.sess-nav .btn[disabled] { opacity: .35; }
.sess-table td small { display: block; color: var(--ink-3); font-size: .75rem; }
.sess-table tr.unscored td { color: var(--ink-3); }
.sess-table-wrap { overflow-x: auto; padding: 8px; }

/* goals */
.goal-card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.goal-fields { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.goal-fields .fld { flex: 1 1 150px; }
.goal-fields .fld input { min-height: 40px; }
.goal-line { margin: 10px 0 0; }
.pace { margin-top: 6px; font-size: .92rem; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.pace.ok { background: var(--good-soft); color: var(--good); }
.pace.behind { background: var(--warn-soft); color: var(--warn); }
.goal-res { margin: -4px 0 12px; font-weight: 600; }
.series { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0 0; }
#hchart .goall { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 2 4; }
#hchart .goalt { fill: var(--gold-ink); font-weight: 700; }
#hchart .dot.quick { fill: var(--surface); stroke: var(--tch); stroke-width: 2.5; }
.chart-empty, .chart-note { margin: 6px 4px; }
.cat-tip { font-size: .86rem; color: var(--ink-2); margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--gold); }

/* recording */
.rec-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: -2px 0 10px; }
.rec-btn { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.rec-btn.on { background: var(--bad); color: #fff; border-color: var(--bad); animation: recpulse 1.4s ease-in-out infinite; }
@keyframes recpulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 30%, transparent); } }
.rec-slot { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rec-slot audio { height: 36px; max-width: 280px; }
.rec-res { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px dashed var(--line); }
.rec-res:first-of-type { border-top: 0; }
.fs-rec-live { color: #fff; background: var(--bad); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: .85rem; animation: recpulse 1.4s ease-in-out infinite; }
body.recording #btn-tools::after { content: ""; }
.hist-io { align-items: center; }
@media print { .rec-row, .sess-bar { display: none !important; } .p-summary td { font-size: 9.5pt; } }

</style>
</head>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);

    cb: {
      flute:      {time: 135, tempo: 132, scales: [['G', 'G4', 2], ['C', 'C4', 3], ['F', 'F4', 2], ['Bb', 'Bb4', 2], ['Eb', 'Eb4', 2], ['Ab', 'Ab4', 2], ['Db', 'Db4', 2], ['Gb', 'Gb4', 2]]},

      clarinet:   {time: 150, tempo: 132, scales: [['G', 'A3', 2], ['C', 'D4', 2], ['F', 'G3', 3], ['Bb', 'C4', 2], ['Eb', 'F3', 3], ['Ab', 'Bb3', 2], ['Db', 'Eb4', 2], ['Gb', 'Ab3', 2]]},

      horn:       {time: 105, scales: [['G', 'D4', 1], ['C', 'G3', 2], ['F', 'C4', 1], ['Bb', 'F3', 2], ['Eb', 'Bb3', 1], ['Ab', 'Eb4', 1], ['Db', 'Ab3', 2], ['Gb', 'Db4', 1]]},

      euphbc:     {time: 120, tempo: 132, sameAs: 'trombone'},  // the "Baritone BC" sheet = trombone's notes
      tuba:       {time: 120, tempo: 132, scales: [['G', 'G1', 2], ['C', 'C2', 1], ['F', 'F1', 2], ['Bb', 'Bb1', 2], ['Eb', 'Eb2', 1], ['Ab', 'Ab1', 2], ['Db', 'Db2', 1], ['Gb', 'Gb1', 2]]},   // older sheet, no time printed: 2:00 assumed (Mat: confirm)
      bells:      {time: 135, tempo: 132, scales: [['G', 'G3', 2], ['C', 'C4', 2], ['F', 'F3', 2], ['Bb', 'Bb3', 2], ['Eb', 'Eb4', 2], ['Ab', 'Ab3', 2], ['Db', 'Db4', 2], ['Gb', 'Gb3', 2]]},   // the GMEA mallet sheet
    },

    sb: {

      oboe:       {time: 150, scales: [['G', 'G4', 1], ['C', 'C4', 2], ['F', 'F4', 2], ['Bb', 'Bb4', 1], ['Eb', 'Eb4', 2], ['Ab', 'Ab4', 1], ['Db', 'Db4', 2], ['Gb', 'Gb4', 1], ['B', 'B3', 2], ['E', 'E4', 2], ['A', 'A4', 1], ['D', 'D4', 2]]},
      clarinet:   {time: 210, scales: [['G', 'A3', 2], ['C', 'D4', 2], ['F', 'G3', 3], ['Bb', 'C4', 2], ['Eb', 'F3', 3], ['Ab', 'Bb3', 2], ['Db', 'Eb4', 2], ['Gb', 'Ab3', 2], ['B', 'Db4', 2], ['E', 'F#3', 3], ['A', 'B3', 2], ['D', 'E3', 3]]},
      basscl:     {time: 165, scales: [['G', 'A3', 2], ['C', 'D4', 1], ['F', 'G3', 2], ['Bb', 'C4', 2], ['Eb', 'F3', 2], ['Ab', 'Bb3', 2], ['Db', 'Eb4', 1], ['Gb', 'Ab3', 2], ['B', 'Db4', 1], ['E', 'F#3', 2], ['A', 'B3', 2], ['D', 'E3', 2]]},
      bassoon:    {time: 195, scales: [['G', 'G2', 2], ['C', 'C2', 2], ['F', 'F2', 2], ['Bb', 'Bb1', 3], ['Eb', 'Eb2', 2], ['Ab', 'Ab2', 2], ['Db', 'Db2', 2], ['Gb', 'Gb2', 2], ['B', 'B1', 2], ['E', 'E2', 2], ['A', 'A2', 2], ['D', 'D2', 2]]},
      altosax:    {time: 165, scales: [['G', 'E4', 2], ['C', 'A4', 1], ['F', 'D4', 2], ['Bb', 'G4', 1], ['Eb', 'C4', 2], ['Ab', 'F4', 2], ['Db', 'Bb3', 2], ['Gb', 'Eb4', 2], ['B', 'Ab4', 1], ['E', 'Db4', 2], ['A', 'F#4', 1], ['D', 'B3', 2]]},
      barisax:    {time: 165, sameAs: 'altosax'},
      tenorsax:   {time: 135, scales: [['G', 'A4', 1], ['C', 'D4', 2], ['F', 'G4', 1], ['Bb', 'C4', 2], ['Eb', 'F4', 2], ['Ab', 'Bb3', 2], ['Db', 'Eb4', 2], ['Gb', 'Ab4', 1], ['B', 'Db4', 2], ['E', 'F#4', 1], ['A', 'B3', 2], ['D', 'E4', 2]]},   // the sheet's footer says 2:15 (Mat: confirm)
      trumpet:    {time: 165, scales: [['G', 'A3', 2], ['C', 'D4', 1], ['F', 'G3', 2], ['Bb', 'C4', 2], ['Eb', 'F4', 1], ['Ab', 'Bb3', 2], ['Db', 'Eb4', 1], ['Gb', 'Ab3', 2], ['B', 'Db4', 1], ['E', 'F#3', 2], ['A', 'B3', 2], ['D', 'E4', 1]]},
      baritonetc: {time: 165, sameAs: 'trumpet'},               // the "Euphonium TC" sheet = trumpet's notes
      horn:       {time: 150, tempo: 144, scales: [['G', 'D4', 1], ['C', 'G3', 2], ['F', 'C4', 1], ['Bb', 'F3', 2], ['Eb', 'Bb3', 1], ['Ab', 'Eb4', 1], ['Db', 'Ab3', 2], ['Gb', 'Db4', 1], ['B', 'Gb3', 2], ['E', 'B3', 1], ['A', 'E4', 1], ['D', 'A3', 2]]},
      trombone:   {time: 165, scales: [['G', 'G2', 2], ['C', 'C3', 1], ['F', 'F2', 2], ['Bb', 'Bb2', 2], ['Eb', 'Eb3', 1], ['Ab', 'Ab2', 2], ['Db', 'Db3', 1], ['Gb', 'Gb2', 2], ['B', 'B2', 1], ['E', 'E2', 2], ['A', 'A2', 2], ['D', 'D3', 1]]},
      euphbc:     {time: 165, sameAs: 'trombone'},              // the "Baritone BC" sheet = trombone's notes
      tuba:       {time: 165, scales: [['G', 'G1', 2], ['C', 'C2', 1], ['F', 'F1', 2], ['Bb', 'Bb1', 2], ['Eb', 'Eb2', 1], ['Ab', 'Ab1', 2], ['Db', 'Db2', 1], ['Gb', 'Gb1', 2], ['B', 'B1', 1], ['E', 'E1', 2], ['A', 'A1', 2], ['D', 'D2', 1]]},
      bells:      {time: 210, scales: [['G', 'G3', 2], ['C', 'C4', 2], ['F', 'F3', 2], ['Bb', 'Bb3', 2], ['Eb', 'Eb4', 2], ['Ab', 'Ab3', 2], ['Db', 'Db4', 2], ['Gb', 'Gb3', 2], ['B', 'B3', 2], ['E', 'E4', 2], ['A', 'A3', 2], ['D', 'D4', 2]]},
    },
  };
  // the order each section's scales are played in (every member's list follows it)
  const AUDITION_ORDER = {
    ms: ['F', 'Bb', 'Eb', 'Ab'],
    cb: ['G', 'C', 'F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'],
    sb: ['G', 'C', 'F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb', 'B', 'E', 'A', 'D'],
  };
  const SECTIONS = [
    {id: 'ms', name: 'Middle School', grades: '6th–8th grade', memory: true},
    {id: 'cb', name: 'Concert Band', grades: '9th–10th grade', memory: false},
    {id: 'sb', name: 'Symphonic Band', grades: '11th–12th grade', memory: false},
  ];
  // the concert keys an audition can ask for: the name and the concert tonic's pitch class
  const CONCERT = {G: ['G', 7], C: ['C', 0], F: ['F', 5], Bb: ['B♭', 10], Eb: ['E♭', 3], Ab: ['A♭', 8], Db: ['D♭', 1], Gb: ['G♭', 6],
    B: ['B', 11], E: ['E', 4], A: ['A', 9], D: ['D', 2]};
  // the chromatic, MIDDLE SCHOOL audition only: mallets play 2 octaves up and down from concert F (the bells member is
  // unchanged). The GMEA mallet sheet says "2-octave chromatic starting on C" (Mat: decide C or F).
  const AUDITION_CHROM = {bells: ['F4', 'F6']};
  // THE HIGH SCHOOL CHROMATIC (cb and sb: one GMEA sheet set), WRITTEN [lowest, highest]: sharps going up, flats coming
  // down, the top note played once (so the lowest note is A♯3 going up, B♭3 coming down on the oboe). Mallets (the GMEA
  // mallet sheet): "2-octave chromatic starting on C, after the major scales, not in the time limit".
  const CHROMATIC_HS = {
    flute: ['C4', 'C7'], oboe: ['Bb3', 'F6'], clarinet: ['E3', 'G6'], basscl: ['E3', 'C6'],
    altosax: ['Bb3', 'F6'], barisax: ['Bb3', 'F6'], tenorsax: ['Bb3', 'F6'],
    horn: ['F3', 'A5'], trumpet: ['F#3', 'C6'], baritonetc: ['F#3', 'C6'],
    bassoon: ['Bb1', 'Bb4'], trombone: ['E2', 'Bb4'], euphbc: ['E2', 'Bb4'], tuba: ['E1', 'Bb3'],
    bells: ['C4', 'C6'],
  };
  // the sheets' rhythm (4/4), only a picture (nothing is judged on it): beats per note, one list per measure. The SAME
  // note values for 1, 2 and 3 octaves (more octaves = more measures): scale measures = quarter, 2 eighths, 4 eighths
  // (7 notes); arpeggio measures = quarter, 2 eighths, quarter, 2 eighths (6 notes; the first starts on the scale's last
  // note); a final whole note. n octaves = 2n scale bars + n arpeggio bars + the whole note.
  //   1 octave:  | 1 2 3 4 5 6 7 | 8 7 6 5 4 3 2 | 1 3 5 8 5 3 | 1 |                                (21 notes, 4 bars)
  //   2 octaves: | 1–7 | 8–14 | 15 14 … 9 | 8 7 … 2 | 1 3 5 8 10 12 | 15 12 10 8 5 3 | 1 |       (41 notes, 7 bars)
  //   3 octaves: | 1–7 | 8–14 | 15–21 | 22–16 | 15–9 | 8–2 | 1 3 5 8 10 12 | 15 17 19 22 19 17 | 15 12 10 8 5 3 | 1 | (61, 10 bars)
  const SCALE_BAR = [1, .5, .5, .5, .5, .5, .5], ARP_BAR = [1, .5, .5, 1, .5, .5];
  const rhythmOf = oct => Array(2 * oct).fill(SCALE_BAR).concat(Array(oct).fill(ARP_BAR), [[4]]);
  const RHYTHM = {1: rhythmOf(1), 2: rhythmOf(2), 3: rhythmOf(3)};

  const LIST = [
    {id: 'Bb', concert: 'B♭', pc: 10},
    {id: 'Eb', concert: 'E♭', pc: 3},
    {id: 'F',  concert: 'F',  pc: 5},
    {id: 'Ab', concert: 'A♭', pc: 8},
    {id: 'chrom', concert: null},
  ];

  const {parseNote, noteLabel, writtenMidi, mod12} = A.music;
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'], LETTER_PC = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11};
  const MAJOR = [0, 2, 4, 5, 7, 9, 11, 12];
  // major keys by tonic pitch class, spelled the usual way (never more than 6 sharps or flats)
  const KEYS = [['C', 0], ['D', -1], ['D', 0], ['E', -1], ['E', 0], ['F', 0], ['G', -1], ['G', 0], ['A', -1], ['A', 0], ['B', -1], ['B', 0]];
  const SHARP_KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'C♯'], FLAT_KEYS = ['C', 'F', 'B♭', 'E♭', 'A♭', 'D♭', 'G♭', 'C♭'];
  const SHARP_ORDER = ['F', 'C', 'G', 'D', 'A', 'E', 'B'], FLAT_ORDER = ['B', 'E', 'A', 'D', 'G', 'C', 'F'];

  /** key signature of a major key: {type: '#'|'b', count} (count 0 = C major) */
  function keySignature(tonic) {
    const name = noteLabel(tonic);
    let i = SHARP_KEYS.indexOf(name);
    if (i > 0) return {type: '#', count: i};
    i = FLAT_KEYS.indexOf(name);
    return {type: 'b', count: Math.max(0, i)};
  }
  /** the accidental a key signature gives a letter: +1, -1 or 0 */
  function sigAcc(sig, letter) {
    if (!sig || !sig.count) return 0;
    return sig.type === '#' ? (SHARP_ORDER.slice(0, sig.count).includes(letter) ? 1 : 0)
                            : (FLAT_ORDER.slice(0, sig.count).includes(letter) ? -1 : 0);
  }
  /** how to DRAW a note under a key signature: the accidental only where the key doesn't already give it */
  function shown(n, sig) {
    if (!sig) return n;
    const a = n.acc === sigAcc(sig, n.letter) ? 0 : n.acc;
    return {letter: n.letter, acc: a, oct: n.oct, natural: a === 0 && n.acc === 0 && sigAcc(sig, n.letter) !== 0};
  }

  /** the written tonic pitch class of a concert scale for a member */
  const writtenPc = (m, s) => mod12(s.pc + m.sounds);
  const fits = (m, midi) => midi >= m.lowMidi && midi + 12 <= m.highMidi;

  /** the rule (see START): the member's written starting midi for scale s */
  function ruleStart(m, s) {
    const inst = A.getInstrument(m.group);
    const bbPc = writtenPc(m, LIST[0]);
    const five = writtenMidi(inst.notes[0]);
    const closest = (pc, near) => {
      let best = null;
      for (let w = m.lowMidi; w <= m.highMidi; w++) {
        if (mod12(w) !== pc || !fits(m, w)) continue;
        const d = Math.abs(w - near);
        if (best === null || d < Math.abs(best - near) ||
            (d === Math.abs(best - near) && (LOW_REGISTER.includes(m.id) ? w > best : w < best))) best = w;
      }
      return best;
    };
    const bb = mod12(five) === bbPc && fits(m, five) ? five : closest(bbPc, five);
    return s.id === 'Bb' ? bb : closest(writtenPc(m, s), bb);
  }

  /** the written starting midi for a member and scale: the START table if it has a usable entry, else the rule */
  function startMidi(m, s) {
    const t = START[m.id] && START[m.id][s.id];
    if (t) {
      const w = writtenMidi(parseNote(t));
      if (mod12(w) === writtenPc(m, s)) return w;
      if (window.console) console.warn(`scales.js: START ${m.id} ${s.id} = ${t} is not the right key; using the rule`);
    }
    return ruleStart(m, s);
  }

  /** spell a one-octave major scale from a written tonic midi (spell = {letter, acc}: the tonic's own spelling, e.g.
      F♯ rather than G♭; left out = the usual one from KEYS) */
  function majorScale(tonicMidi, spell) {
    const [tl, ta] = spell && mod12(LETTER_PC[spell.letter] + spell.acc) === mod12(tonicMidi) ? [spell.letter, spell.acc] : KEYS[mod12(tonicMidi)];
    const tOct = Math.floor((tonicMidi - LETTER_PC[tl] - ta) / 12) - 1;
    const li = LETTERS.indexOf(tl);
    return MAJOR.map((iv, i) => {
      const letter = LETTERS[(li + i) % 7], oct = tOct + Math.floor((li + i) / 7);
      const midi = tonicMidi + iv;
      return {letter, acc: midi - ((oct + 1) * 12 + LETTER_PC[letter]), oct, midi};
    });
  }

  /**
   * Build a scale for a member. Returns
   *   {id, name ('Concert E♭'), label ('Concert E♭ (your F Major)'), short ('E♭'), key ('F Major') | null,
   *    sig {type, count} | null, up: [...], notes: [...up, then down]}
   * Each note: {letter, acc, oct, midi (written), sounding (midi), pc (concert pitch class), show (how to draw it)}
   */
  function build(m, id) {
    const s = LIST.find(x => x.id === id) || LIST[0];
    let up, down, sig = null, key = null;
    if (s.id === 'chrom') {
      up = A.chromaticScale(m);
      down = A.chromaticScale(m, {down: true}).slice(1);
    } else {
      up = majorScale(startMidi(m, s));
      down = up.slice(0, -1).reverse();
      sig = keySignature(up[0]);
      key = noteLabel(up[0]) + ' Major';
    }
    const dress = n => Object.assign({}, n, {sounding: n.midi - m.sounds, pc: mod12(n.midi - m.sounds), show: shown(n, sig)});
    up = up.map(dress);
    const notes = up.concat(down.map(dress));
    const name = s.id === 'chrom' ? 'Chromatic' : 'Concert ' + s.concert;
    return {id: s.id, name, short: s.concert || 'Chromatic', key, sig, up, notes,
            label: key ? `${name} (your ${key})` : `Chromatic (${noteLabel(up[0])}${up[0].oct} to ${noteLabel(up[up.length - 1])}${up[up.length - 1].oct})`};
  }

  /** a section id that exists ('ms' when not) */
  const secOf = sec => (AUDITION[sec] ? sec : 'ms');
  /** a member's entry in a section, `sameAs` resolved: {time, tempo, scales: [[key, start, octaves]…]} or null */
  function auditionEntry(m, sec) {
    const T = AUDITION[secOf(sec)], id = m && (m.id || m), e = T[id];
    if (!e) return null;
    const src = e.sameAs ? T[e.sameAs] : e;
    return {time: e.time || src.time, tempo: e.tempo || null, scales: src.scales || [], sameAs: e.sameAs || null};
  }

  /**
   * THE AUDITION SCALE for a member (AUDITION above): {id, name, label, key, sig, octaves, notes, measures, slurs}
   * notes: the scale up and down (any number of octaves), then its arpeggio, each {letter, acc, oct, midi (written),
   * sounding, pc, show, beats, measure}; measures = how many notes each measure holds (the sheet's 4/4 picture).
   */
  function audition(m, id, sec = 'ms') {
    const e = auditionEntry(m, sec), row = e && e.scales.find(x => x[0] === id), c = CONCERT[id];
    if (!row || !c) return null;
    const [, start, octaves] = row;
    const p = parseNote(start), t = writtenMidi(p);
    if (mod12(t - m.sounds) !== c[1] && window.console) console.warn(`scales.js: AUDITION ${secOf(sec)} ${m.id} ${id} = ${start} is not concert ${c[0]}`);
    let up = majorScale(t, p);
    for (let o = 1; o < octaves; o++) up = up.concat(majorScale(t + 12 * o, p).slice(1));
    // the arpeggio: 3-5-8 in each octave up to the top tonic, then back down to the tonic
    const steps = [];
    for (let o = 0; o < octaves; o++) steps.push(7 * o + 2, 7 * o + 4, 7 * o + 7);
    const arp = steps.concat(steps.slice(0, -1).reverse(), [0]).map(i => up[i]);
    const sig = keySignature(up[0]), key = noteLabel(up[0]) + ' Major';
    const R = RHYTHM[octaves] || rhythmOf(octaves), beats = [].concat(...R), bars = R.map(r => r.length);
    let k = 0;
    const measureOf = bars.reduce((a, n, mi) => a.concat(Array(n).fill(mi)), []);
    const notes = up.concat(up.slice(0, -1).reverse(), arp).map(n => Object.assign({}, n, {
      sounding: n.midi - m.sounds, pc: mod12(n.midi - m.sounds), show: shown(n, sig), beats: beats[k], measure: measureOf[k++]}));
    const name = 'Concert ' + c[0];
    // ARTICULATION, as on the GMEA sheets: tongue going up, slur coming down. slurs = [first, last] note indexes: the
    // scale's top note down to the tonic where the scale ends, then the arpeggio's top note down to the final whole
    // note (the arpeggio going up stays tongued). Mallets can't slur: none.
    const top = 7 * octaves, arpTop = 17 * octaves;
    const slurs = m.family === 'percussion' ? [] : [[top, 2 * top], [arpTop, notes.length - 1]];
    return {id, name, short: c[0], key, sig, octaves, notes, measures: bars, slurs, label: `${name} (your ${key})`};
  }
  /** every audition scale of a section for a member, in the order printed */
  const auditionScales = (m, sec = 'ms') => AUDITION_ORDER[secOf(sec)].map(id => audition(m, id, sec)).filter(Boolean);
  /** the audition's chromatic scale for a member: MS = its GMEA range (mallets: AUDITION_CHROM); HS = CHROMATIC_HS.
      Sharps going up, flats coming down (HS: the lowest note too: A♯3 going up, B♭3 coming down) */
  function auditionChromatic(m, sec = 'ms') {
    const hs = secOf(sec) !== 'ms', o = hs ? CHROMATIC_HS[m.id] : AUDITION_CHROM[m.id];
    const withRange = (lo, hi) => Object.assign({}, m, {low: lo, high: hi, lowMidi: writtenMidi(lo), highMidi: writtenMidi(hi)});
    let up, down;
    if (o && hs) {

  A.linkTo = function (path, extra = {}) {

  A.playerLink = (gameId, root = '../') => {

  A.requireInstrument = function (gameId) {
    const inst = A.store.player ? A.currentInstrument() : null;      // the exact instrument must be chosen (a member)

  const floorData = () => (A.store && A.store.gameData ? A.store.gameData('floor') : null);
  const gameById = id => (A.GAMES || []).find(g => g.id === id && !g.tool) || null;

  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>';

      (mountTopbar), so a game opened from a link counts too */
  A.RECENT_KEEP = 8;

    const d = floorData();

  A.inZone = function (g, z) {

    if (z && z.auto === 'new') return games.slice().sort((a, b) => (A.gameAge(a) - A.gameAge(b)) || games.indexOf(a) - games.indexOf(b));
    if (z && z.auto === 'favorites') return A.favorites();                     // in the order they were starred
    const rank = g => { const i = order.indexOf(g.id); return i < 0 ? order.length + games.indexOf(g) : i; };

  A.zonesOf = g => (g && g.zones || []).map(A.zoneById).filter(Boolean);

  A.gameFit = function (g, memberId, zone) {

  A.featuredGame = function () {

  A.gameStars = function (g) {

  /** Standard game top bar: "← Arcade" back to the arcade floor on the left, the sound button and instrument chip on the right.

  /* {fixed: 'Bell Kit'}: a game with its own instrument shows it as a plain label, not a link to Select Player.

    const w = 2 * Math.PI * f / fs, al = Math.sin(w) / (2 * q), a0 = 1 + al;
    const b0 = al / a0, b2 = -al / a0, a1 = -2 * Math.cos(w) / a0, a2 = (1 - al) / a0, y = new Float32Array(x.length);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < x.length; i++) { const v = b0 * x[i] + b2 * x2 - a1 * y1 - a2 * y2; x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v; }

  }
  function renderClick(ctx, accent, CLICK = CLICK_P) {
    const fs = ctx.sampleRate, key = fs + (accent ? 'hi' : 'lo') + (CLICK === BLOCK ? 'b' : '');

    const noise = Float32Array.from({length: n}, rnd), fr = accent ? CLICK.hi : CLICK.lo;

    fr.forEach((f, k) => layer(bandpass(noise, fs, f, CLICK.q[k]), CLICK.tau[k], CLICK.mix[k]));

        live.slice().forEach(x => { try { x.node.stop(); } catch (e) {} });
        live.length = 0;
      },
      fade(s = .15) { const n = ctx.currentTime; master.gain.cancelScheduledValues(n); master.gain.setValueAtTime(master.gain.value, n); master.gain.linearRampToValueAtTime(0, n + s); },
      count: () => live.filter(x => x.t > ctx.currentTime).length,
      ctx,
    };
    return kit;
  }

/* What appears on each round, for the round-picker cards */

      : ['Snare: etude + sight reading', 'Xylophone: etude + sight reading', 'Timpani: etude, sight reading, tuning', 'Scored out of 300'];
  }
  if (round === 'district') {
    const n = level === 'ms' ? 4 : level === 'concert' ? 8 : 12;
    return [`${n} major scales + arpeggios (30)`, 'Chromatic scale (10)', 'Lyrical etude (30)', 'Sight reading (30)'];

    ? ['Prepared selection (60)', 'Sight reading #1 (20)', 'Sight reading #2 (20)']
    : ['Etude #1 (30)', 'Etude #2 (30)', 'Sight reading #1 (20)', 'Sight reading #2 (20)'];
