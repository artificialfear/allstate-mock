<html lang="en">
<head>

<title>All-State Mock Audition</title>
<meta name="description" content="Score practice All-State Band auditions on the GMEA district and state judge sheets, then print or share the results with students.">

<style>
@font-face { font-family: "Oswald"; font-weight: 600; font-style: normal; font-display: swap;
  src: url("assets/oswald-latin-600-normal.woff2?v=1") format("woff2"); }
/* Raven Band palette: navy + gold (matches Agenda Board / Raven Band Hub) */
:root {
  color-scheme: light;
  --navy: #1f2a44; --navy-deep: #141c30; --gold: #c9a227; --gold-soft: #f6efd8;
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eef0f5;
  --line: #e1e4ec;
  --ink: #1b2233;
  --ink-2: #4f586b;
  --ink-3: #7c8496;
  --brand: #1f2a44;
  --brand-2: #34477a;
  --on-brand: #ffffff;
  --gold-ink: #8a6d12;
  --accent: #1f2a44;
  --accent-soft: #e8ecf5;
  --good: #1d7a4a;
  --good-soft: #e3f3ea;
  --bad: #b3372f;
  --bad-soft: #fbe7e5;
  --warn: #8a5a00;
  --warn-soft: #fdf3dc;
  --self: #eb6834;
  --tch: #2a78d6;
  --shadow: 0 1px 2px rgb(20 28 48 / 0.06), 0 4px 16px rgb(20 28 48 / 0.06);
  --r: 14px;
  --display: "Oswald", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --serif: var(--display);
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --navy: #141c30; --navy-deep: #0e1424; --gold-soft: #2c2816;
    --bg: #111827; --surface: #1b2335; --surface-2: #232d45; --line: #34405e;
    --ink: #f2f4f8; --ink-2: #b7bfd0; --ink-3: #8590a8;
    --brand: #c9a227; --brand-2: #e0bf55; --on-brand: #141c30; --gold-ink: #e0bf55;
    --accent: #c9a227; --accent-soft: #27304a;
    --good: #5cc28d; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1d1a; --warn: #f0c060; --warn-soft: #33290f;
    --self: #d95926; --tch: #3987e5;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --navy: #141c30; --navy-deep: #0e1424; --gold-soft: #2c2816;
  --bg: #111827; --surface: #1b2335; --surface-2: #232d45; --line: #34405e;
  --ink: #f2f4f8; --ink-2: #b7bfd0; --ink-3: #8590a8;
  --brand: #c9a227; --brand-2: #e0bf55; --on-brand: #141c30; --gold-ink: #e0bf55;
  --accent: #c9a227; --accent-soft: #27304a;
  --good: #5cc28d; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1d1a; --warn: #f0c060; --warn-soft: #33290f;
  --self: #d95926; --tch: #3987e5;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); min-height: 100vh; overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--ink-2); }
.small { font-size: 0.86rem; }
.tiny { font-size: 0.78rem; }
.center { text-align: center; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: 0.01em; }

/* topbar — navy with a gold rule, like the Raven Band pages */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--navy); color: #fff; border-bottom: 3px solid var(--gold); }
.tb-home { border: 0; background: none; padding: 0; color: var(--gold); width: 36px; height: 36px; flex: none; }
.tb-home svg { width: 36px; height: 36px; display: block; }
.tb-mid { flex: 1; min-width: 0; }
.tb-brand { font-family: var(--display); font-weight: 600; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.06em; }
.tb-student { font-family: var(--display); font-weight: 600; font-size: 1.1rem; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-meta { font-size: 0.8rem; color: rgb(255 255 255 / 0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-total { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb-score { font-family: var(--display); font-size: 1.6rem; font-weight: 600; color: var(--gold); }
.tb-max { color: rgb(255 255 255 / 0.6); margin-left: 3px; }
.tb-icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgb(255 255 255 / 0.22); background: rgb(255 255 255 / 0.06); display: grid; place-items: center; flex: none; color: #fff; }
.tb-icon:hover { border-color: var(--gold); }
.tb-icon svg { width: 20px; height: 20px; }
.tb-icon.live { color: var(--navy); background: var(--gold); border-color: var(--gold); }

main { padding-top: 20px; padding-bottom: 40px; }
.foot { color: var(--ink-3); font-size: 0.78rem; text-align: center; padding-bottom: 28px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 0.9rem; }
.btn.big { min-height: 54px; font-size: 1.08rem; padding: 10px 24px; }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.back { border: 0; background: none; color: var(--brand-2); font-weight: 600; padding: 6px 0; margin-bottom: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; font-weight: 600; min-height: 34px; }

/* home */
.hero-band { position: relative; width: 100vw; margin: -20px calc(50% - 50vw) 0; background: var(--navy); color: #fff; overflow: hidden; }
.hero-band::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(900px 400px at 85% 10%, rgb(201 162 39 / 0.18), transparent 60%),
  repeating-linear-gradient(0deg, transparent 0 23px, rgb(255 255 255 / 0.035) 23px 24px); pointer-events: none; }
.hero-in { position: relative; max-width: 980px; margin: 0 auto; padding: 44px 16px 52px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; align-items: center; }
.eyebrow { font-family: var(--display); color: var(--gold); text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.9rem; margin-bottom: 10px; }
.hero-band h1 { font-size: clamp(2.3rem, 5.4vw, 4rem); text-transform: uppercase; line-height: 1.02; letter-spacing: 0.01em; }
.hero-band h1 em { font-style: normal; color: var(--gold); }
.hero-band p { color: rgb(255 255 255 / 0.82); max-width: 52ch; margin: 16px 0 22px; font-size: 1.05rem; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #141c30; font-weight: 700; }
.btn.gold:hover { filter: brightness(1.06); }
.btn.on-navy { background: transparent; color: #fff; border-color: rgb(255 255 255 / 0.35); }
.btn.on-navy:hover { border-color: var(--gold); }
/* mini judge sheet */
.mini { justify-self: center; width: min(360px, 100%); background: #fdfcf8; color: #1b1a18; border-radius: 6px; padding: 18px 18px 14px; transform: rotate(2.5deg);
  box-shadow: 0 30px 60px -20px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(0 0 0 / 0.04); font: 12px/1.35 "Times New Roman", Times, serif; position: relative; }
.mini::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -10px; height: 10px; background: #e9e6dd; border-radius: 0 0 6px 6px; z-index: -1; transform: rotate(-3deg); }
.mini-t { text-align: center; font-weight: 700; font-size: 13px; }
.mini-s { text-align: center; font-size: 11px; margin-bottom: 8px; }
.mini-info { display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding-bottom: 3px; margin-bottom: 8px; font-size: 11px; }
.mini-info b { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; color: #1f3a8a; font-weight: 400; font-size: 13px; }
.mini table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.mini td, .mini th { border: 1px solid #333; text-align: center; padding: 2px 3px; font-size: 11px; }
.mini th { background: #eee; font-weight: 700; }
.mini .ck { color: #1d7a4a; font-weight: 700; font-family: var(--sans); }
.mini .xx { color: #b3372f; font-weight: 700; font-family: var(--sans); }
.mini-rub { display: grid; grid-template-columns: 92px 1fr; gap: 3px 6px; font-size: 11px; margin-bottom: 8px; }
.mini-rub span:nth-child(even) { color: #777; letter-spacing: 0.5px; white-space: nowrap; }
.mini-rub i { font-style: normal; color: #000; border: 1.5px solid #1f3a8a; border-radius: 50%; padding: 0 3px; }
.mini-tot { border-top: 2px solid #000; padding-top: 5px; display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
.mini-tot b { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; color: #1f3a8a; font-size: 20px; font-weight: 400; }
.stamp { position: absolute; top: -16px; right: -18px; transform: rotate(12deg); border: 3px solid var(--gold); color: var(--gold); font-family: var(--display); font-size: 22px; letter-spacing: 0.12em; padding: 2px 10px; border-radius: 6px; background: rgb(253 252 248 / 0.75); }
/* home sections */
.home-sec { margin-top: 30px; }
.sec-label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.95rem; color: var(--gold-ink); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.continue { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cont { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.cont:hover { border-color: var(--gold); }
.cont.resume { border-left: 4px solid var(--gold); }
.cont-k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-ink); font-weight: 700; }
.cont-n { font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.02em; }
.cont-v { color: var(--ink-2); font-size: 0.86rem; }
.grade-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.gcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .15s, border-color .15s, box-shadow .15s; }
.gcard:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 14px 30px -14px rgb(20 28 48 / 0.35); }
.gcard-top { background: var(--navy); color: #fff; padding: 16px 18px 14px; border-bottom: 3px solid var(--gold); }
.gnum { font-family: var(--display); font-size: 3.2rem; line-height: 0.95; color: var(--gold); letter-spacing: 0.01em; }
.gnum small { font-size: 0.9rem; letter-spacing: 0.14em; color: rgb(255 255 255 / 0.7); display: block; margin-bottom: 4px; }
.gname { font-family: var(--display); font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; }
.gcard ul { list-style: none; margin: 0; padding: 14px 18px 16px; display: grid; gap: 6px; font-size: 0.92rem; color: var(--ink-2); }
.gcard li { display: flex; gap: 8px; }
.gcard .nw { white-space: nowrap; }
.gcard li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-top: 0.55em; }
.gcard .go { margin-top: auto; padding: 10px 18px 14px; font-weight: 700; color: var(--brand-2); }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; counter-reset: how; }
.how > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.how svg { width: 44px; height: 44px; padding: 9px; border-radius: 12px; background: var(--navy); color: var(--gold); }
.how h3 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.04em; }
.how h3::before { counter-increment: how; content: counter(how) ". "; color: var(--gold-ink); }
.how p { margin: 4px 0 0; color: var(--ink-2); font-size: 0.9rem; }
.home-help { margin-top: 18px; text-align: center; }
.credit { color: var(--ink-3); }
.credit b { color: var(--gold-ink); font-weight: 600; }
@media (max-width: 860px) {
  .hero-in { grid-template-columns: 1fr; padding: 32px 20px 36px; gap: 0; }
  .mini { display: none; }
  .grade-cards, .how { grid-template-columns: 1fr; }
  .gcard-top { display: flex; align-items: flex-end; gap: 14px; }
  .gnum { font-size: 2.6rem; }
  .gname { margin: 0 0 4px; }
}
.steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 18px 0 14px; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-3); padding-right: 10px; }
.steps li span { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 0.75rem; }
.steps li.done { color: var(--ink-2); }
.steps li.done span { background: var(--surface-2); }
.steps li.cur { color: var(--ink); font-weight: 700; }
.steps li.cur span { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.pick-h { font-size: 1.55rem; margin: 6px 0 14px; text-transform: uppercase; letter-spacing: 0.03em; }
.fam { font-family: var(--sans); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 18px 0 8px; }
.cards { display: grid; gap: 12px; }
.cards.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.cards.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.cards.inst { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pick { text-align: left; padding: 18px; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, transform .15s; }
.pick:hover { border-color: var(--gold); transform: translateY(-1px); }
.pick.sm { padding: 14px; min-height: 56px; justify-content: center; }
.pick-g { font-size: 0.8rem; font-weight: 700; color: var(--gold-ink); text-transform: uppercase; letter-spacing: 0.06em; }
.pick-t { font-family: var(--display); font-size: 1.4rem; font-weight: 600; letter-spacing: 0.02em; }
.pick.sm .pick-t { font-size: 1.05rem; font-family: var(--sans); font-weight: 600; }
.pick-s { font-size: 0.86rem; color: var(--ink-2); }
.pick.round ul { margin: 6px 0 8px; padding-left: 18px; color: var(--ink-2); font-size: 0.92rem; }
.nag { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); padding: 12px 14px; border-radius: 12px; margin: 10px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 0.92rem; }
.variant { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; color: var(--ink-2); font-size: 0.92rem; }

/* segmented */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg.wrap { flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 0.9rem; color: var(--ink-2); min-height: 38px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* setup */
.formcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.sheet-id { display: flex; flex-direction: column; margin-bottom: 14px; }
.sheet-id strong { font-family: var(--display); font-weight: 600; font-size: 1.2rem; letter-spacing: 0.02em; }
.sheet-id span { color: var(--ink-2); font-size: 0.9rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 0.86rem; color: var(--ink-2); font-weight: 600; }
.fld.wide { grid-column: 1 / -1; }
.fld input, .fld select { min-height: 46px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-weight: 400; font-size: 1rem; }
.fld input:focus, .fld select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.flow { border: 0; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.flow legend { font-weight: 700; margin-bottom: 8px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.radio.on { border-color: var(--brand-2); background: var(--accent-soft); }
.radio input { margin-top: 4px; accent-color: var(--brand); width: 18px; height: 18px; }
.radio span { display: flex; flex-direction: column; }
.radio small { color: var(--ink-2); font-size: 0.86rem; }
details.tips { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
details.tips summary { font-weight: 700; cursor: pointer; }
details.tips ul, .modal ul { padding-left: 18px; }
details.tips li, .modal li { margin: 6px 0; }

/* sheet */
.sheet-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 10px; }
.sheet-head .sheet-id { margin: 0; }
.banner { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 0.93rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.banner.self { background: color-mix(in srgb, var(--self) 14%, var(--surface)); border-color: color-mix(in srgb, var(--self) 40%, transparent); }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.group-h { font-size: 1.4rem; margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 3px solid var(--gold); text-transform: uppercase; letter-spacing: 0.05em; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sec-h h3 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.04em; padding-left: 10px; border-left: 4px solid var(--gold); }
.sec-score { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.sec-score span { font-family: var(--display); font-weight: 600; color: var(--ink); font-size: 1.4rem; }
.progress { height: 3px; background: var(--surface-2); border-radius: 3px; margin: 8px 0 10px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.help { color: var(--ink-2); font-size: 0.88rem; margin: 0 0 10px; }
.help.practice { font-style: italic; }
.sec-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

.item { padding: 10px 0; border-top: 1px dashed var(--line); }
.item:first-child { border-top: 0; }
.item-h { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
.val { font-variant-numeric: tabular-nums; font-weight: 800; }
.val small { color: var(--ink-3); font-weight: 400; }
.scale-chips { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.sc { min-height: 42px; min-width: 0; padding: 0 2px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.sc:hover { border-color: var(--ink-3); }
.sc.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.sc.nudge { background: var(--surface-2); color: var(--brand-2); }
.slider { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.slider .ticks { grid-column: 2; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--ink-3); margin-top: -4px; }
.slider input[type=range] { width: 100%; accent-color: var(--brand); height: 32px; }
.slider.unset input[type=range] { opacity: 0.45; }

/* wind scale rows */
.srow { display: grid; grid-template-columns: minmax(72px, 0.9fr) auto auto auto 52px auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.srow:first-child { border-top: 0; }
.skey { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 5px; }
.skey b { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.skey small { color: var(--ink-2); }
.oct { font-size: 0.72rem; color: var(--ink-3); width: 100%; }
.cg { display: flex; align-items: center; gap: 4px; }
.cg > span { font-size: 0.72rem; color: var(--ink-3); width: 30px; text-align: right; margin-right: 2px; }
.cell { width: 44px; height: 44px; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--bg); font-weight: 700; color: var(--ink-3); font-size: 0.95rem; }
.cell.ok { border: 1.5px solid var(--good); background: var(--good-soft); color: var(--good); }
.cell.no { border: 1.5px solid var(--bad); background: var(--bad-soft); color: var(--bad); }
.stot { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.stot small { color: var(--ink-3); font-weight: 400; }
.rowbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 0.8rem; padding: 6px 8px; min-height: 36px; white-space: nowrap; }
.factor { margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.mrow { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.mrow:first-child { border-top: 0; }
.mcol .lbl { font-size: 0.74rem; color: var(--ink-3); display: block; margin-bottom: 3px; }

.cmt-wrap { margin-top: 10px; }
.cmt-wrap summary { cursor: pointer; font-weight: 600; color: var(--brand-2); font-size: 0.92rem; padding: 4px 0; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.qc { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: 0.82rem; min-height: 34px; }
.qc:hover { border-color: var(--brand-2); }
textarea.cmt { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); resize: vertical; font-size: 0.98rem; }
.sheet-foot { display: flex; justify-content: flex-end; margin-top: 18px; }

/* results */
.res-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 6px 0 14px; border-bottom: 3px solid var(--gold); margin-bottom: 14px; }
.res-name { font-family: var(--display); font-size: 2.3rem; font-weight: 600; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
.res-meta { color: var(--ink-2); font-size: 0.92rem; margin-top: 4px; }
.res-total { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.res-total .big { font-family: var(--display); font-size: 3.6rem; font-weight: 600; line-height: 1; color: var(--brand); }
.res-total .of { color: var(--ink-3); font-size: 1.2rem; }
.res-total .pc { margin-left: 8px; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-weight: 700; color: var(--ink-2); }
.res-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.res-grid .panel { margin: 0; }
.res-grid + .res-grid { margin-top: 12px; }
.panel h3 { font-size: 1.15rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.panel h4 { font-family: var(--sans); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 14px 0 6px; }
.panel.good { border-top: 4px solid var(--good); }
.panel.focus { border-top: 4px solid var(--warn); }
.cut .cut-msg { font-size: 1.05rem; }
.cut.above .cut-msg b { color: var(--good); }
.cut.below .cut-msg b { color: var(--bad); }
.gauge { position: relative; height: 14px; background: var(--surface-2); border-radius: 7px; margin: 30px 0 8px; }
.gauge i { display: block; height: 100%; border-radius: 7px; background: var(--accent); }
.gauge .mark { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--ink); }
.gauge .mark em { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 0.75rem; font-weight: 700; white-space: nowrap; margin-bottom: 2px; }
.bar { margin: 10px 0; }
.bar-l { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; }
.bar-l b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-t { height: 8px; background: var(--surface-2); border-radius: 4px; margin-top: 4px; overflow: hidden; }
.bar-t i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.lost { margin: 0; padding-left: 20px; }
.lost li { margin: 6px 0; }
.lost li { display: list-item; }
.lost li span { display: inline-block; min-width: 60%; }
.lost li b { color: var(--bad); font-variant-numeric: tabular-nums; float: right; }
.miss { margin: 0; padding-left: 18px; font-size: 0.92rem; }
.miss li { margin: 4px 0; }
.cat { padding: 8px 0; border-top: 1px dashed var(--line); }
.cat:first-of-type { border-top: 0; }
.cat-h { display: flex; justify-content: space-between; }
.cat-h span { font-weight: 800; font-variant-numeric: tabular-nums; }
.cat-ctx { font-size: 0.82rem; color: var(--ink-3); }
.insight { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; margin: 10px 0 0; }
.plan { list-style: none; padding: 0; margin: 0; counter-reset: p; }
.plan li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); }
.plan li:first-child { border-top: 0; }
.plan .min { font-weight: 800; color: var(--brand-2); font-variant-numeric: tabular-nums; }
.plan b { display: block; }
.plan span { color: var(--ink-2); font-size: 0.92rem; }
.cmp-sum { margin: 0 0 8px; }
.cmp-legend { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-2); margin-bottom: 6px; }
.cmp-legend .k { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-left: 8px; }
.cmp-legend .k.self { background: var(--self); }
.cmp-legend .k.tch { background: var(--tch); }
.cmp-row { display: grid; grid-template-columns: minmax(130px, 1fr) 1.4fr; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.cmp-row.flag .cmp-l { font-weight: 700; }
.cmp-l { font-size: 0.88rem; }
.cmp-l em { display: block; font-style: normal; font-size: 0.75rem; color: var(--warn); font-weight: 700; }
.cmp-bars { display: grid; gap: 3px; }
.cb { display: grid; grid-template-columns: 1fr 36px; align-items: center; gap: 6px; }
.cb i { display: block; height: 8px; border-radius: 0 4px 4px 0; min-width: 2px; }
.cb.self i { background: var(--self); }
.cb.tch i { background: var(--tch); }
.cb span { font-size: 0.78rem; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cmt-block p { margin: 0 0 8px; }
.cmt-block ul { margin: 0; padding-left: 18px; }

/* history */
.hist { display: grid; grid-template-columns: 220px 1fr; gap: 14px; }
.hist-list { display: flex; flex-direction: column; gap: 6px; }
.hist-st { text-align: left; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; display: flex; flex-direction: column; }
.hist-st span { font-size: 0.8rem; color: var(--ink-3); }
.hist-st.on { border-color: var(--brand-2); background: var(--accent-soft); }
.hist-main { min-width: 0; }
.combo { font-weight: 700; margin-bottom: 8px; }
.chart-wrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; margin: 10px 0; }
#hchart svg { width: 100%; height: auto; display: block; }
#hchart .g { stroke: var(--line); stroke-width: 1; }
#hchart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); }
#hchart .cutl { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
#hchart .cutt { fill: var(--ink-2); font-weight: 600; }
#hchart .ln { fill: none; stroke: var(--tch); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
#hchart .dot { fill: var(--tch); stroke: var(--surface); stroke-width: 2; }
#hchart .hit { fill: transparent; cursor: pointer; }
#hchart .lbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--sans); }
.htip { position: absolute; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 0.82rem; pointer-events: none; display: flex; flex-direction: column; white-space: nowrap; }
.htable { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.htable th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px; border-bottom: 1px solid var(--line); }
.htable td { padding: 8px 6px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
.htable .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.htable .num small { display: block; font-size: 0.75rem; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.htable .acts { text-align: right; white-space: nowrap; }
.htable .acts .btn { margin-left: 4px; }
.hist-io { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

/* tools panel */
.tools { position: fixed; right: 12px; top: 64px; z-index: 40; width: min(320px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 40px rgb(0 0 0 / 0.18); padding: 12px 14px; }
.tools-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.tool { padding: 10px 0; border-top: 1px solid var(--line); }
.tool-l { font-weight: 700; font-size: 0.9rem; }
.t-time { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.t-time.over { color: var(--bad); }
.tool-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.bpm { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
.x { border: 0; background: none; font-size: 1.1rem; color: var(--ink-2); width: 36px; height: 36px; border-radius: 8px; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.45); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-card { position: relative; background: var(--surface); border-radius: var(--r); max-width: 620px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 22px; }
.modal-card > .x { position: absolute; top: 10px; right: 10px; }
.modal h3 { font-size: 1.3rem; margin: 0 40px 8px 0; }
.modal h4 { margin: 16px 0 6px; }
.share-opts { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; font-size: 0.92rem; }
.share-opts input { accent-color: var(--brand); }
.share-url { display: flex; gap: 8px; }
.share-url input { flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); font-size: 0.85rem; }
.qr { display: flex; align-items: center; gap: 14px; margin: 14px 0; }
.qr svg { width: 150px; height: 150px; background: #fff; border-radius: 8px; flex: none; }
.qr span { color: var(--ink-2); font-size: 0.88rem; }
.calib { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.calib th { text-align: left; white-space: nowrap; padding: 6px 10px 6px 0; vertical-align: top; }
.calib td { padding: 6px 0; color: var(--ink-2); }
.calib tr { border-top: 1px dashed var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; transition: all .2s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* blank-box helpers */
.banner.blanks { flex-direction: column; align-items: flex-start; }
.banner-acts { display: flex; gap: 8px; flex-wrap: wrap; }
@keyframes flash { 0%, 60% { background: var(--warn-soft); box-shadow: 0 0 0 3px var(--warn); } 100% { background: transparent; box-shadow: none; } }
.flash { animation: flash 2.4s ease-out; border-radius: 10px; }
.cell.flash-cell { border-color: var(--warn); border-style: solid; }

/* responsive */
@media (max-width: 720px) {
  .hist { grid-template-columns: 1fr; }
  .hist-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .hist-st { flex: none; }
  .srow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 12px; }
  .srow .skey { order: 0; flex: 1 0 calc(100% - 140px); flex-wrap: nowrap; align-self: center; }
  .srow .rowbtn { order: 1; align-self: center; }
  .srow .stot { order: 2; min-width: 40px; align-self: center; }
  .srow .cg { order: 3; position: relative; padding-top: 16px; flex-wrap: nowrap; }
  .srow .cg > span { position: absolute; top: 0; left: 0; width: auto; text-align: left; margin: 0; }
  .cell { width: 42px; height: 42px; }
  .oct { width: auto; margin-left: 6px; }
  .mrow { grid-template-columns: 1fr; gap: 6px; }
  .res-total .big { font-size: 2.4rem; }
  .res-name { font-size: 1.6rem; }
  .cmp-row { grid-template-columns: 1fr; gap: 4px; }
  .tb-total .tb-max { display: none; }
}
@media (max-width: 400px) {
  .cell { width: 38px; height: 40px; }
  .cg { gap: 3px; }
}
@media (max-width: 520px) {
  /* wrap long chip rows into two rows of 6 so every target stays finger-sized */
  .scale-chips { grid-auto-flow: row; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .mcol .scale-chips { grid-template-columns: repeat(5, 1fr); }
  .sc { min-height: 42px; }
}

/* ===================== PRINT ===================== */
.print { display: none; }
@media print {
  @page { size: letter; margin: 0.45in; }
  body { background: #fff; color: #000; }
  .topbar, #main, .foot, .tools, .modal, .toast { display: none !important; }
  .print { display: block; font: 10.5pt/1.35 "Times New Roman", Times, serif; color: #000; }
  .p-page { page-break-after: always; }
  .p-page:last-child { page-break-after: auto; }
  .p-mock { text-align: right; font: 700 8pt Arial, sans-serif; letter-spacing: 0.08em; color: #555; }
  .p-title { text-align: center; font-size: 14pt; font-weight: 700; }
  .p-sub { text-align: center; font-size: 12pt; font-weight: 700; margin-bottom: 4px; }
  .p-div { text-align: center; font-size: 10pt; }
  .p-info { width: 100%; border-collapse: collapse; margin: 6px 0 8px; }
  .p-info td { padding: 2px 4px; border-bottom: 1px solid #000; }
  .p-group { font-size: 12pt; margin: 10px 0 2px; border-bottom: 1.5px solid #000; font-family: inherit; }
  .p-group span { font-weight: 400; font-size: 10pt; }
  .p-sec { margin: 6px 0; break-inside: avoid; }
  .p-sech { font-weight: 700; display: flex; justify-content: space-between; }
  .p-tot { font-weight: 400; }
  .p-scales { width: 100%; border-collapse: collapse; margin: 3px 0; }
  .p-scales th, .p-scales td { border: 1px solid #000; padding: 1px 6px; text-align: center; font-size: 9.5pt; }
  .p-scales th { background: #eee; }
  .p-calc { text-align: right; font-size: 9.5pt; }
  .p-rub { width: 100%; border-collapse: collapse; }
  .p-rub td { padding: 0 4px; font-size: 9.5pt; }
  .p-rub td:first-child { width: 30%; }
  .p-rub i { font-style: normal; color: #888; letter-spacing: 1px; }
  .circ { border: 1.5px solid #000; border-radius: 50%; padding: 0 4px; }
  .p-mallet { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 9.5pt; }
  .p-note { font-size: 8.5pt; font-style: italic; color: #444; }
  .p-total { margin-top: 10px; font-size: 13pt; text-align: right; border-top: 2px solid #000; padding-top: 6px; }
  .p-total span { display: block; font-size: 9pt; }
  .p-big { text-align: center; font-size: 22pt; font-weight: 700; margin: 10px 0; }
  .p-big span { display: block; font-size: 10pt; font-weight: 400; }
  .p-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .print h4 { font-size: 11pt; margin: 10px 0 2px; }
  .print ul, .print ol { margin: 2px 0; padding-left: 18px; }
  .p-foot { margin-top: 16px; font-size: 8pt; color: #555; text-align: center; }
}

/* ---------- form builders ---------- */
function buildForm(level, round, inst, variant) {
  const L = LEVELS[level];
  const instMeta = INSTRUMENTS.find((i) => i.id === inst);
  const key = `${round}.${level}.${inst}`;
  const form = {
    key, level, round, inst, variant: variant || null,
    title: `${L.band} (Grades ${L.grades.replace('–', '-')})`,
    subtitle: (inst === 'percussion' ? 'Percussion ' : 'Wind Instrument ') + (round === 'district' ? 'District' : 'State') + ' Audition Form',
    instrumentLabel: instMeta.name,
    division: round === 'state' && level !== 'ms' && ORCH_INSTRUMENTS.includes(inst),
    cut: null,
    notices: [],
    sections: [],
  };
  if (FORM_NOTICES[key]) form.notices.push(FORM_NOTICES[key]);

  if (inst === 'percussion') {
    round === 'district' ? buildPercDistrict(form, level) : buildPercState(form);
  } else if (round === 'district') {
    buildWindDistrict(form, level, inst, variant);
  } else {
    buildWindState(form, level);
  }
  form.max = sum(form.sections.map((s) => s.max));
  return form;
}

function buildWindDistrict(form, level, inst, variant) {
  let rows, factor, cut;
  if (level === 'ms') {
    const d = MS_DISTRICT[inst];
    let oct = d.oct, written = d.written;
    if (d.variants) {
      const v = d.variants[variant || d.defaultVariant];
      form.variant = variant || d.defaultVariant;
      form.variantLabel = v.label;
      oct = v.oct; written = v.written;
    }
    rows = MS_KEYS.map((k, i) => ({ id: 'r' + i, concert: k, written: written ? written[i] : '', oct: oct[i] }));
    factor = d.factor; cut = d.cut;
  } else {
    const d = HS_DISTRICT[level][inst];
    rows = d.scales.map(([concert, written, max], i) => ({ id: 'r' + i, concert, written, oct: (max - 1) / 2 }));
    factor = d.factor; cut = d.cut;
  }
  form.cut = cut;
  const rawMax = sum(rows.map((r) => 2 * r.oct + 1));
  form.sections.push({
    id: 'scales', title: 'Major Scales and Arpeggios', kind: 'windScales', rows, factor, rawMax,
    max: rawMax * factor, maxLabel: 30, catKey: 'scales',
    timeLimit: SCALE_TIME_LIMIT[level] || null, tempo: LEVELS[level].tempo,
    help: 'One point for each octave played correctly ascending, one for each octave descending, and one for the arpeggio. From memory, per the GMEA scale sheet.',
  });
  form.sections.push({ id: 'chrom', title: 'Chromatic Scale', kind: 'rubric', max: 10, catKey: 'chromatic',

  form.sections.push({ id: 'lyr', title: 'Lyrical Etude', kind: 'rubric', max: 30, items: items(R6, 5) });
  form.sections.push({ id: 'sr', title: 'Sight Reading Exercise', kind: 'rubric', max: 30, items: items(R6, 5), sightReading: true });
}

function catKeyFor(label) {
  const l = label.toLowerCase();
  if (l.startsWith('tone quality') || l === 'tone production' || l.includes('technique/tone')) return 'tone';
  if (l === 'technique' || l === 'mallet technique') return 'technique';
  if (l.startsWith('rhythmic')) return 'rhythm';
  if (l.startsWith('articulation')) return 'artic';
  if (l.startsWith('dynamics')) return 'dynamics';
  if (l.startsWith('interpretation') || l.startsWith('phrasing')) return 'interp';
  if (l.startsWith('rudiment')) return 'rudiments';
  if (l.startsWith('roll')) return 'rolls';
  if (l.startsWith('tempo/pulse')) return 'pulse';
  if (l === 'accuracy' || l === 'note accuracy') return 'accuracy';
  if (l.includes('tuning') || l.startsWith('pitch changes')) return 'tuning';
  if (l.startsWith('chromatic')) return 'chromatic';
  return 'general';
}

/* ---------- scoring ---------- */
function cellKeys(sec, r) {
  const k = [];
  for (let i = 1; i <= r.oct; i++) k.push(`${sec.id}.${r.id}.a${i}`);
  for (let i = 1; i <= r.oct; i++) k.push(`${sec.id}.${r.id}.d${i}`);
  k.push(`${sec.id}.${r.id}.arp`);
  return k;
}
function sectionKeys(sec) {
  if (sec.kind === 'windScales') return sec.rows.flatMap((r) => cellKeys(sec, r));
  if (sec.kind === 'malletScales') return sec.rows.flatMap((r) => [`${sec.id}.${r.id}.s`, `${sec.id}.${r.id}.a`]);
  return sec.items.map((it) => `${sec.id}.${it.id}`);
}
function scoreSection(sec, s) {
  const keys = sectionKeys(sec);
  let done = keys.filter((k) => s[k] != null).length;
  /* wind scale boxes default to 0: once any box in the section is tapped, every box counts as scored */
  if (sec.kind === 'windScales' && done) done = keys.length;
  const raw = keys.reduce((a, k) => a + (s[k] || 0), 0);
  const total = sec.kind === 'windScales' ? raw * sec.factor : raw;
  return { sec, raw, total, max: sec.max, done, cells: keys.length };
}
function scoreForm(form, s) {
  const sections = form.sections.map((sec) => scoreSection(sec, s));
  return {
    sections, total: sections.reduce((a, x) => a + x.total, 0), max: form.max,
    done: sections.reduce((a, x) => a + x.done, 0), cells: sections.reduce((a, x) => a + x.cells, 0),
  };
}
function hasScores(who) { return S.mock && Object.values(S.mock.scores[who] || {}).some((v) => v != null); }

/* category roll-up across sections (scored items only) */
function categoryStats(form, s) {
  const m = {};
  const add = (key, got, max, ctx) => {
    if (!m[key]) m[key] = { key, got: 0, max: 0, ctx: [] };
    m[key].got += got; m[key].max += max; if (ctx && !m[key].ctx.includes(ctx)) m[key].ctx.push(ctx);
  };
  form.sections.forEach((sec) => {
    const r = scoreSection(sec, s);
    if (sec.kind === 'windScales' || sec.kind === 'malletScales') {
      if (r.done) add(sec.catKey, r.total, sec.max * (r.done / r.cells), sec.group || null);
      return;
    }
    sec.items.forEach((it) => {
      const v = s[`${sec.id}.${it.id}`];
      if (v == null) return;
      add(it.catKey || catKeyFor(it.label), v, it.max, sec.title.replace(/^.*— /, ''));
    });
  });
  return Object.values(m).filter((x) => x.max > 0).map((x) => ({ ...x, pct: pct(x.got, x.max) }));
}
/* every box left blank, with a readable label; scaleCell = a scale octave/arpeggio box */
function blankItems(form, s) {
  const out = [];
  form.sections.forEach((sec) => {
    const short = sec.title.replace(/^.*— /, '');
    if (sec.kind === 'windScales') {
      /* unmarked boxes are 0 points; only flag a scale section where nothing at all was tapped */
      const keys = sectionKeys(sec);
      if (!keys.some((k) => s[k] != null)) out.push({ k: keys[0], secId: sec.id, scaleCell: false, label: `${sec.title} (nothing marked)` });
    } else if (sec.kind === 'malletScales') {
      sec.rows.forEach((row) => [['s', 'scale'], ['a', 'arpeggio']].forEach(([p, what]) => {
        const k = `${sec.id}.${row.id}.${p}`;
        if (s[k] == null) out.push({ k, secId: sec.id, scaleCell: true, label: `${row.concert} ${what} (mallets)` });
      }));
    } else {
      sec.items.forEach((it) => {
        const k = `${sec.id}.${it.id}`;
        if (s[k] == null) out.push({ k, secId: sec.id, scaleCell: false, label: sec.items.length > 1 ? `${short} · ${it.label}` : short });
      });
    }
  });
  return out;
}
/* set blank scale boxes to 0 (✗). secId limits it to one section. Returns how many changed. */
function zeroBlankScales(s, secId) {
  let n = 0;
  blankItems(FORM, s).forEach((b) => {
    if (!b.scaleCell || (secId && b.secId !== secId)) return;
    s[b.k] = 0; n++;
  });
  return n;
}
function scaleMisses(form, s) {
  const out = [];
  form.sections.forEach((sec) => {
    if (sec.kind === 'windScales') {
      if (!sectionKeys(sec).some((k) => s[k] != null)) return; // section not scored yet
      sec.rows.forEach((r) => {
        const miss = [];
        for (let i = 1; i <= r.oct; i++) if (s[`${sec.id}.${r.id}.a${i}`] !== 1) miss.push(r.oct > 1 ? `up oct ${i}` : 'ascending');
        for (let i = 1; i <= r.oct; i++) if (s[`${sec.id}.${r.id}.d${i}`] !== 1) miss.push(r.oct > 1 ? `down oct ${i}` : 'descending');
        if (s[`${sec.id}.${r.id}.arp`] !== 1) miss.push('arpeggio');
        if (miss.length) out.push({ key: keyLabel(r), miss });
      });
    } else if (sec.kind === 'malletScales') {
      sec.rows.forEach((r) => {
        const sv = s[`${sec.id}.${r.id}.s`], av = s[`${sec.id}.${r.id}.a`]; const miss = [];
        if (sv != null && sv < sec.scaleMax) miss.push(`scale ${fmt(sv)}/${sec.scaleMax}`);
        if (av != null && av < sec.arpMax) miss.push(`arpeggio ${fmt(av)}/${sec.arpMax}`);
        if (miss.length) out.push({ key: r.concert, miss });
      });
    }
  });
  return out;
}
function keyLabel(r) { return r.written ? `${r.concert} (${r.written})` : r.concert; }

/* ---------- share links ---------- */
function b64u(bytes) { let s = ''; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(str) { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, (c) => c.charCodeAt(0)); }
async function streamBytes(bytes, Stream, fmtName) {
  const st = new Blob([bytes]).stream().pipeThrough(new Stream(fmtName));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function packMock(m, opts) {
  const strip = (o) => Object.fromEntries(Object.entries(o || {}).filter(([, v]) => v != null && v !== ''));
  return {
    v: 1, id: m.id, l: m.level, r: m.round, i: m.inst, va: m.variant || undefined,
    n: opts.firstName ? (m.student.name || '').trim().split(/\s+/)[0] : m.student.name, sch: m.student.school, g: m.student.grade,
    j: m.judge, d: m.date, t: strip(m.scores.teacher), s: opts.self ? strip(m.scores.self) : {},
    ct: strip(m.comments.teacher), cs: opts.self ? strip(m.comments.self) : {}, ot: m.overall.teacher, os: opts.self ? m.overall.self : '',
  };
}
function unpackMock(p) {
  return {
    id: p.id || uid(), v: 1, created: Date.now(), updated: Date.now(), level: p.l, round: p.r, inst: p.i, variant: p.va || null,
    student: { name: p.n || '', school: p.sch || '', grade: p.g || '' }, judge: p.j || '', date: p.d || '',
    flow: 'teacher', scores: { teacher: p.t || {}, self: p.s || {} }, comments: { teacher: p.ct || {}, self: p.cs || {} },
    overall: { teacher: p.ot || '', self: p.os || '' }, saved: false,
  };
}
async function encodeShare(m, opts) {
  const bytes = new TextEncoder().encode(JSON.stringify(packMock(m, opts)));
  if (window.CompressionStream) {
    try { return 'z' + b64u(await streamBytes(bytes, CompressionStream, 'deflate-raw')); } catch (e) { /* fall through */ }
  }
  return 'j' + b64u(bytes);
}
async function decodeShare(data) {
  let bytes = unb64u(data.slice(1));
  if (data[0] === 'z') bytes = await streamBytes(bytes, DecompressionStream, 'deflate-raw');
  return unpackMock(JSON.parse(new TextDecoder().decode(bytes)));
}
function shareBase() { return location.origin + location.pathname; }

function sectionInner(sec) {
  const s = sc(); const r = scoreSection(sec, s);
  const prog = r.cells ? Math.round((r.done / r.cells) * 100) : 0;
  let body = '';
  if (sec.kind === 'windScales') body = windScalesBody(sec, s, r);
  else if (sec.kind === 'malletScales') body = malletBody(sec, s);
  else body = sec.items.map((it) => rubricItem(sec, it, s[`${sec.id}.${it.id}`])).join('');
  const cmt = S.mock.comments[S.who][sec.id] || '';
  const quick = quickFor(sec, FORM);
  const tools = [];
  if (sec.timeLimit) tools.push(`<button class="chip-btn" data-act="timer" data-v="${sec.timeLimit}">⏱ Time limit ${mmss(sec.timeLimit * 1000)}</button>`);
  if (sec.tempo) tools.push(`<button class="chip-btn" data-act="metro" data-v="${sec.tempo}">♩ = ${sec.tempo}</button>`);
  if (sec.kind === 'windScales' || sec.kind === 'malletScales') {
    tools.push(`<button class="chip-btn" data-act="allperfect" data-v="${sec.id}">Start from perfect</button>`);
    if (sec.kind === 'malletScales' && r.done < r.cells) tools.push(`<button class="chip-btn" data-act="blankzero" data-v="${sec.id}" title="Every blank box in this section becomes ✗ (0 points)">Mark blanks ✗</button>`);
  }
  return `
    <div class="sec-h">
      <h3>${esc(sec.title)}</h3>
      <div class="sec-score"><span>${fmt(r.total, 2)}</span> / ${fmt(sec.maxLabel || sec.max, 2)}</div>
    </div>
    <div class="progress" title="${r.done} of ${r.cells} scored"><i style="width:${prog}%"></i></div>
    ${sec.help ? `<p class="help">${esc(sec.help)}</p>` : ''}
        ${tools.length ? `<div class="sec-tools">${tools.join('')}</div>` : ''}
    <div class="sec-body">${body}</div>
    <details class="cmt-wrap" ${cmt ? 'open' : ''}><summary>Comments${cmt ? ' ✎' : ''}</summary>
      <div class="quick">${quick.map((q) => `<button class="qc" data-act="quick" data-sec="${sec.id}" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <textarea class="cmt" data-sec="${sec.id}" rows="2" placeholder="Notes for the student">${esc(cmt)}</textarea>
    </details>`;
}

function windScalesBody(sec, s, r) {
  const rows = sec.rows.map((row) => {
    const ks = cellKeys(sec, row);
    const rr = ks.reduce((a, k) => a + (s[k] || 0), 0);
    const cell = (k, label) => { const v = s[k]; return `<button class="cell ${v === 1 ? 'ok' : ''}" data-act="cell" data-k="${k}" aria-label="${label}${v === 1 ? ' — correct' : ' — 0 points'}" aria-pressed="${v === 1}">${v === 1 ? '✓' : label}</button>`; };
    const up = []; const dn = [];
    for (let i = 1; i <= row.oct; i++) { up.push(cell(`${sec.id}.${row.id}.a${i}`, row.oct > 1 ? String(i) : '↑')); dn.push(cell(`${sec.id}.${row.id}.d${i}`, row.oct > 1 ? String(i) : '↓')); }
    return `<div class="srow">
      <div class="skey"><b>${row.concert}</b>${row.written ? `<small>(${row.written})</small>` : ''}<span class="oct">${row.oct} oct</span></div>
      <div class="cg"><span>Up</span>${up.join('')}</div>
      <div class="cg"><span>Down</span>${dn.join('')}</div>
      <div class="cg"><span>Arp</span>${cell(`${sec.id}.${row.id}.arp`, '•')}</div>
      <div class="stot">${rr}<small>/${2 * row.oct + 1}</small></div>
      <button class="rowbtn" data-act="rowall" data-sec="${sec.id}" data-row="${row.id}" title="Mark this whole scale correct (tap again to clear)">✓ all</button>
    </div>`;
  }).join('');
  return `${rows}<div class="factor">Raw ${r.raw} / ${sec.rawMax} × ${sec.factor.toFixed(4)} = <strong>${fmt(r.total, 2)}</strong></div>
    <p class="help tiny">Every box starts at 0 points. Tap a box for <b>✓</b> when that octave or arpeggio was played correctly; tap again to take it back. Written keys (in parentheses) are for transposing instruments.</p>`;
}
function malletBody(sec, s) {
  return sec.rows.map((row) => `<div class="mrow"><div class="skey"><b>${row.concert}</b></div>
    <div class="mcol"><span class="lbl">Scale</span>${scoreWidget(`${sec.id}.${row.id}.s`, s[`${sec.id}.${row.id}.s`], sec.scaleMax, 0.5)}</div>
    <div class="mcol"><span class="lbl">Arpeggio</span>${scoreWidget(`${sec.id}.${row.id}.a`, s[`${sec.id}.${row.id}.a`], sec.arpMax, 0.5)}</div></div>`).join('');
}
function rubricItem(sec, it, v) {
  return `<div class="item"><div class="item-h"><span>${esc(it.label)}</span><span class="val">${v == null ? '—' : fmt(v)} <small>/ ${it.max}</small></span></div>
    ${scoreWidget(`${sec.id}.${it.id}`, v, it.max, it.step)}</div>`;
}
function scoreWidget(key, v, max, step) {
  const n = Math.round(max / step);
  if (n <= 10) {
    let h = '';
    for (let i = 0; i <= n; i++) { const x = i * step; h += `<button class="sc ${v === x ? 'on' : ''}" data-act="set" data-k="${key}" data-v="${x}">${fmt(x)}</button>`; }
    return `<div class="scale-chips">${h}</div>`;
  }
  if (max <= 10) {
    let h = '';
    for (let i = 0; i <= max; i++) { const on = v != null && Math.floor(v) === i; h += `<button class="sc ${on ? 'on' : ''} ${on && v % 1 ? 'half' : ''}" data-act="set" data-k="${key}" data-v="${i}">${i}${on && v % 1 ? '½' : ''}</button>`; }
    return `<div class="scale-chips int">${h}<button class="sc nudge" data-act="nudge" data-k="${key}" data-v="${step}" data-max="${max}" aria-label="Add half point">+½</button></div>`;
  }
  return `<div class="slider ${v == null ? 'unset' : ''}">
    <button class="sc nudge" data-act="nudge" data-k="${key}" data-v="${-step}" data-max="${max}" aria-label="Minus half point">−</button>
    <input type="range" min="0" max="${max}" step="${step}" value="${v == null ? 0 : v}" data-k="${key}" aria-label="score">
    <button class="sc nudge" data-act="nudge" data-k="${key}" data-v="${step}" data-max="${max}" aria-label="Plus half point">+</button>
    <span class="ticks"><span>0</span><span>${max / 2}</span><span>${max}</span></span></div>`;
}
function refreshSection(secId) {
  const sec = FORM.sections.find((x) => x.id === secId);
  const el = $(`#sec-${secId}`);
  if (!sec || !el) return;
  const open = $('.cmt-wrap', el)?.open;
  el.innerHTML = sectionInner(sec);
  if (open) $('.cmt-wrap', el).open = true;
  const r = scoreForm(FORM, sc());
  const lt = $('#live-total'); if (lt) lt.textContent = fmt(r.total, 1);
}
function setScore(k, v) {
  const s = sc();
  if (v == null) delete s[k]; else s[k] = v;
  touch(); refreshSection(k.split('.')[0]);
}

/* ---------- results ---------- */
/* strengths / focus areas / sight-reading gap / practice plan — shared by results page and printout */
function analyze(form, s) {
  const cats = categoryStats(form, s).sort((a, b) => b.pct - a.pct);
  const strengths = cats.filter((c) => c.pct >= 70).slice(0, 3);
  const focus = cats.slice().sort((a, b) => a.pct - b.pct || (b.max - b.got) - (a.max - a.got))
    .filter((c) => c.pct < 90 && !strengths.includes(c)).slice(0, 3);
  const misses = scaleMisses(form, s);
  /* sight reading vs prepared music, scored items only */
  const part = (secs) => {
    let got = 0, max = 0;
    secs.forEach((sec) => sec.items.forEach((it) => { const v = s[`${sec.id}.${it.id}`]; if (v != null) { got += v; max += it.max; } }));
    return max ? pct(got, max) : null;
  };
  const sp = part(form.sections.filter((x) => x.sightReading));
  const pp = part(form.sections.filter((x) => !x.sightReading && x.kind === 'rubric' && !x.catKey));
  const srGap = sp != null && pp != null && pp - sp >= 12 ? { sp, pp } : null;
  return { cats, strengths, focus, misses, srGap, plan: practicePlan(focus, srGap, misses) };
}
function resultsWho() { return hasScores('teacher') ? 'teacher' : 'self'; }
function viewResults() {
  const m = S.mock; const who = resultsWho();
  const s = m.scores[who]; const r = scoreForm(FORM, s);
  const { strengths, focus, misses, srGap, plan } = analyze(FORM, s);
  const unscored = r.cells - r.done;
  const ro = S.readOnly;
  const lost = r.sections.map((x) => ({ t: x.sec.title, lost: Math.max(0, x.max - x.total) })).sort((a, b) => b.lost - a.lost);
  const cutBlock = FORM.cut ? cutGauge(r.total, FORM.cut, r.max) : '';

  return `
  ${ro ? `<div class="banner">Shared mock audition results (read-only). Nothing here is stored online; everything is inside the link.</div>` : backBtn('sheet')}
  <section class="res-head">
    <div>
      <div class="res-name">${esc(m.student.name || 'Student')}</div>
      <div class="res-meta">${esc(FORM.instrumentLabel)}${FORM.variantLabel ? ' (' + esc(FORM.variantLabel) + ')' : ''} · ${esc(LEVELS[m.level].short)} (${LEVELS[m.level].grades}) · ${m.round === 'district' ? 'First Round (District)' : 'Final Round (State)'}<br>
      ${m.date ? fmtDate(m.date) : ''}${m.judge ? ' · Judge: ' + esc(m.judge) : ''}${who === 'self' ? ' · <em>Student self-assessment</em>' : ''}</div>
    </div>
    <div class="res-total"><span class="big">${fmt(r.total, 2)}</span><span class="of">/ ${fmt(r.max, 0)}</span><span class="pc">${fmt(pct(r.total, r.max), 0)}%</span></div>
  </section>
  ${unscored ? blankBanner(s, ro) : ''}
  ${cutBlock}
  <div class="res-actions">
    <button class="btn primary" data-act="print">Print / Save PDF</button>
    ${ro ? '' : '<button class="btn" data-act="share">Share link</button>'}
    ${ro ? '' : '<button class="btn" data-act="go" data-v="sheet">Edit scores</button>'}
    ${ro ? '' : '<button class="btn ghost" data-act="again">New mock, same student</button>'}
  </div>

  <div class="res-grid">
    <section class="panel">
      <h3>Section scores</h3>
      ${r.sections.map((x) => barRow(x.sec.title, x.total, x.max)).join('')}
    </section>
    <section class="panel">
      <h3>Where the points went</h3>
      <ol class="lost">${lost.filter((x) => x.lost > 0.004).map((x) => `<li><span>${esc(x.t)}</span><b>−${fmt(x.lost, 2)}</b></li>`).join('') || '<li><span>No points lost. A perfect sheet!</span></li>'}</ol>
      ${misses.length ? `<h4>Scale spots to fix</h4><ul class="miss">${misses.map((x) => `<li><b>${esc(x.key)}</b> ${x.miss.map(esc).join(', ')}</li>`).join('')}</ul>` : ''}
    </section>
  </div>

  <div class="res-grid">
    <section class="panel good">
      <h3>Strengths</h3>
      ${strengths.length ? strengths.map((c) => catLine(c)).join('') : '<p class="muted">Score more categories to see strengths.</p>'}
    </section>
    <section class="panel focus">
      <h3>Focus next</h3>
      ${focus.length ? focus.map((c) => catLine(c)).join('') : '<p class="muted">Nothing below 90%. Keep polishing and run the full audition often.</p>'}
      ${srGap ? `<p class="insight">Sight reading (${fmt(srGap.sp, 0)}%) is well behind prepared music (${fmt(srGap.pp, 0)}%). A daily sight-reading habit will gain the most points.</p>` : ''}
    </section>
  </div>

  <section class="panel">
    <h3>Practice plan for this week</h3>
    <ol class="plan">${plan.map((p) => `<li><span class="min">${p.min} min</span><div><b>${esc(p.t)}</b><span>${esc(p.d)}</span></div></li>`).join('')}</ol>
    <p class="muted small">Suggested daily routine based on this mock. Adjust it to the student.</p>
  </section>

  ${hasScores('self') && hasScores('teacher') ? compareBlock() : ''}
  ${commentsBlock(who)}
  ${ro ? '' : `<p class="muted small center">${m.saved ? 'Saved to this device’s student history.' : ''}</p>`}`;
}
function blankBanner(s, ro) {
  const blanks = blankItems(FORM, s);
  const scaleBlanks = blanks.filter((b) => b.scaleCell).length;
  const shown = blanks.slice(0, 6).map((b) => `<b>${esc(b.label)}</b>`).join(', ') + (blanks.length > 6 ? `, and ${blanks.length - 6} more` : '');
  const n = blanks.length;
  return `<div class="banner warn blanks"><div>${n} box${n > 1 ? 'es were' : ' was'} left blank and count${n > 1 ? '' : 's'} as 0, like the official sheet: ${shown}.</div>
    ${ro ? '' : `<div class="banner-acts">
      ${scaleBlanks ? `<button class="btn sm" data-act="blankzero" data-v="all">Count blank scale boxes as ✗ (0 pts)</button>` : ''}
      <button class="btn sm ghost" data-act="gofix">Go to ${n > 1 ? 'first blank' : 'it'}</button></div>`}</div>`;
}
function cutGauge(total, cut, max) {
  const diff = total - cut;
  const p = Math.min(100, pct(total, max)); const c = pct(cut, max);
  return `<section class="panel cut ${diff >= 0 ? 'above' : 'below'}">
    <div class="cut-msg">${diff >= 0
      ? `<b>${fmt(diff, 2)} points above</b> the state-level recommendation line (${fmt(cut)}).`
      : `<b>${fmt(-diff, 2)} points below</b> the state-level recommendation line (${fmt(cut)}).`}</div>
    <div class="gauge"><i style="width:${p}%"></i><span class="mark" style="left:${c}%"><em>${fmt(cut)}</em></span></div>
    <p class="muted small">The minimum district total for a state-level audition recommendation, as printed on this instrument’s form.</p>
  </section>`;
}
function barRow(label, got, max) {
  const p = Math.max(0, Math.min(100, pct(got, max)));
  return `<div class="bar"><div class="bar-l"><span>${esc(label)}</span><b>${fmt(got, 2)} / ${fmt(max, 2)}</b></div><div class="bar-t"><i style="width:${p}%"></i></div></div>`;
}
function catLine(c) {
  const C = CATS[c.key] || CATS.general;
  return `<div class="cat"><div class="cat-h"><b>${C.name}</b><span>${fmt(c.pct, 0)}%</span></div>
    ${c.ctx.filter((x) => x.toLowerCase() !== C.name.toLowerCase()).length ? `<div class="cat-ctx">${c.ctx.filter((x) => x.toLowerCase() !== C.name.toLowerCase()).map(esc).join(' · ')}</div>` : ''}</div>`;
}
function practicePlan(focus, srGap, misses) {
  const plan = [{ min: 5, t: 'Warm-up and long tones', d: 'Start every session with a full, centered sound across the range.' }];
  focus.forEach((c, i) => {
    const C = CATS[c.key] || CATS.general;
    let d = C.tips[0];
    if ((c.key === 'scales' || c.key === 'malletscales') && misses.length) d = `Start with ${misses.slice(0, 3).map((x) => x.key).join(', ')}. ` + C.tips[0];
    plan.push({ min: i === 0 ? 10 : 8, t: C.name, d });
  });
  if (srGap) plan.push({ min: 5, t: 'Sight reading', d: PATTERN_TIPS.sightReading.tips[1] });
  plan.push({ min: 5, t: 'Full mock run', d: 'Play the whole audition in order without stopping, as if a judge is listening. Record it once a week.' });
  return plan;
}
function compareBlock() {
  const t = S.mock.scores.teacher, s = S.mock.scores.self;
  const rows = [];
  FORM.sections.forEach((sec) => {
    if (sec.kind === 'windScales' || sec.kind === 'malletScales') {
      const a = scoreSection(sec, s), b = scoreSection(sec, t);
      if (a.done && b.done) rows.push({ l: sec.title, self: a.total, tch: b.total, max: sec.max });
      return;
    }
    sec.items.forEach((it) => {
      const a = s[`${sec.id}.${it.id}`], b = t[`${sec.id}.${it.id}`];
      if (a != null && b != null) rows.push({ l: (sec.items.length > 1 ? sec.title.replace(/^.*— /, '') + ' · ' : '') + it.label, self: a, tch: b, max: it.max });
    });
  });
  if (!rows.length) return '';
  /* compare only what both people scored, so a half-finished self-assessment isn't read as "lower" */
  const ss = rows.reduce((a, x) => a + x.self, 0), ts = rows.reduce((a, x) => a + x.tch, 0), mx = rows.reduce((a, x) => a + x.max, 0);
  const d = ss - ts;
  const flagged = rows.filter((x) => Math.abs(x.self - x.tch) >= Math.max(1, x.max * 0.15));
  return `<section class="panel">
    <h3>Self-assessment vs. teacher</h3>
    <p class="cmp-sum">On the ${rows.length} categories both of you scored (${fmt(mx, 1)} points possible): student <b>${fmt(ss, 2)}</b> · teacher <b>${fmt(ts, 2)}</b>. ${Math.abs(d) < 1 ? 'Very well calibrated.' : d > 0 ? `The student rated themselves <b>${fmt(d, 1)} points higher</b>.` : `The student rated themselves <b>${fmt(-d, 1)} points lower</b>.`}</p>
    <div class="cmp-legend"><span class="k self"></span>Student <span class="k tch"></span>Teacher</div>
    <div class="cmp">${rows.map((x) => {
      const big = Math.abs(x.self - x.tch) >= Math.max(1, x.max * 0.15);
      return `<div class="cmp-row ${big ? 'flag' : ''}"><div class="cmp-l">${esc(x.l)}${big ? `<em>${x.self > x.tch ? 'rated higher' : 'rated lower'}</em>` : ''}</div>
        <div class="cmp-bars"><div class="cb self"><i style="width:${pct(x.self, x.max)}%"></i><span>${fmt(x.self)}</span></div>
        <div class="cb tch"><i style="width:${pct(x.tch, x.max)}%"></i><span>${fmt(x.tch)}</span></div></div></div>`;
    }).join('')}</div>
    ${flagged.length ? `<p class="insight">Talk through the ${flagged.length} flagged categor${flagged.length > 1 ? 'ies' : 'y'}. Big gaps usually mean the student can’t yet hear that problem in their own playing. Recording and listening back helps.</p>` : ''}
  </section>`;
}
function commentsBlock(who) {
  const m = S.mock;
  const blocks = [];
  ['teacher', 'self'].forEach((w) => {
    const c = m.comments[w] || {};
    const list = FORM.sections.filter((sec) => c[sec.id]).map((sec) => `<li><b>${esc(sec.title)}:</b> ${esc(c[sec.id])}</li>`);
    const ov = m.overall[w];
    if (list.length || ov) blocks.push(`<div class="cmt-block"><h4>${w === 'teacher' ? 'Judge comments' : 'Student reflection'}</h4>${ov ? `<p>${esc(ov)}</p>` : ''}${list.length ? `<ul>${list.join('')}</ul>` : ''}</div>`);
  });
  return blocks.length ? `<section class="panel">${blocks.join('')}</section>` : '';
}

          <td class="acts"><button class="btn sm" data-act="hopen" data-v="${m.id}">Open</button><button class="btn sm ghost" data-act="hdel" data-v="${m.id}" aria-label="Delete">✕</button></td></tr>`;

function drawHistoryChart() {
  const el = $('#hchart'); if (!el) return;
  const h = getHistory().filter((m) => studentKey(m) === S.histKey && `${m.round}|${m.level}|${m.inst}` === S.histFilter)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.created - b.created);
  const pts = h.map((m) => ({ m, s: m.summary || summarize(m) }));
  if (!pts.length) { el.innerHTML = ''; return; }
  const W = 640, H = 220, P = { l: 40, r: 16, t: 16, b: 34 };
  const max = pts[0].s.max; const cut = pts[0].s.cut;
  const x = (i) => pts.length === 1 ? (P.l + W - P.r) / 2 : P.l + (i * (W - P.l - P.r)) / (pts.length - 1);
  const y = (v) => P.t + (1 - v / max) * (H - P.t - P.b);
  const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(f * max)}" y2="${y(f * max)}" class="g"/><text x="${P.l - 6}" y="${y(f * max) + 4}" class="ax" text-anchor="end">${fmt(f * max, 0)}</text>`).join('');
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.s.total)}`).join(' ');
  const cutL = cut ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(cut)}" y2="${y(cut)}" class="cutl"/><text x="${W - P.r}" y="${y(cut) - 5}" class="ax cutt" text-anchor="end">Recommendation line ${fmt(cut)}</text>` : '';
  const xl = pts.map((p, i) => `<text x="${x(i)}" y="${H - 12}" class="ax" text-anchor="middle">${esc(fmtDate(p.m.date).replace(/, \d{4}$/, ''))}</text>`).join('');
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.s.total)}" r="5" class="dot"/><circle cx="${x(i)}" cy="${y(p.s.total)}" r="16" class="hit" data-i="${i}"/>`).join('');
  const last = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score history chart">${grid}${cutL}<path d="${line}" class="ln"/>${dots}${xl}
    <text x="${x(pts.length - 1)}" y="${y(last.s.total) - 12}" class="lbl" text-anchor="${pts.length > 1 ? 'end' : 'middle'}">${fmt(last.s.total, 1)}</text></svg>`;
  const tip = $('#htip');
  $$('.hit', el).forEach((c) => {
    const show = () => {
      const p = pts[+c.dataset.i]; const b = el.getBoundingClientRect(); const cb = c.getBoundingClientRect();
      tip.innerHTML = `<b>${fmt(p.s.total, 2)} / ${fmt(p.s.max, 0)}</b><span>${fmtDate(p.m.date)}${p.s.who === 'self' ? ' · self' : ''}</span>`;
      tip.hidden = false; tip.style.left = (cb.left - b.left + cb.width / 2) + 'px'; tip.style.top = (cb.top - b.top - 8) + 'px';
    };
    c.addEventListener('pointerenter', show); c.addEventListener('click', show);
    c.addEventListener('pointerleave', () => (tip.hidden = true));
  });
}
function exportHistory() {

function importHistory(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result); const inc = Array.isArray(d) ? d : d.mocks;
      if (!Array.isArray(inc)) throw new Error('bad');
      const h = getHistory(); let added = 0, upd = 0;
      inc.forEach((m) => {
        if (!m || !m.id || !m.level || !LEVELS[m.level]) return;
        const i = h.findIndex((x) => x.id === m.id);
        if (i < 0) { h.push(m); added++; } else if ((m.updated || 0) > (h[i].updated || 0)) { h[i] = m; upd++; }

  };
  rd.readAsText(file);
}

function printTicks(max, step, v) {
  const ticks = [];
  for (let x = 0; x <= max + 1e-9; x += step) ticks.push(Math.round(x * 100) / 100);
  let placed = v == null;
  const out = [];
  ticks.forEach((t, i) => {
    if (!placed && v < t && (i === 0 || v > ticks[i - 1])) { out.push(`<b class="circ">${fmt(v)}</b>`); placed = true; }
    out.push(v === t ? `<b class="circ">${fmt(t)}</b>` : `<span>${fmt(t)}</span>`);
    if (v === t) placed = true;
  });
  return out.join('<i> . . . </i>');
}

const T = { start: 0, acc: 0, running: false, limit: 0, iv: null };
function timerNow() { return T.acc + (T.running ? Date.now() - T.start : 0); }
function timerPaint() {
  const el = $('#t-time'); if (!el) return;
  const ms = timerNow(); el.textContent = mmss(ms);
  el.classList.toggle('over', !!T.limit && ms > T.limit * 1000);
  $('#t-limit').textContent = T.limit ? `limit ${mmss(T.limit * 1000)}` : 'no limit';
  $('#t-go').textContent = T.running ? 'Pause' : timerNow() ? 'Resume' : 'Start';
}
function timerToggle() {
  if (T.running) { T.acc = timerNow(); T.running = false; clearInterval(T.iv); }
  else { T.start = Date.now(); T.running = true; T.iv = setInterval(timerPaint, 200); }
  timerPaint();
}
function timerReset() { T.running = false; T.acc = 0; clearInterval(T.iv); timerPaint(); }

const MT = { ctx: null, on: false, bpm: 120, next: 0, iv: null, beat: 0 };
function metroStart() {
  if (!MT.ctx) MT.ctx = new (window.AudioContext || window.webkitAudioContext)();
  MT.ctx.resume(); MT.on = true; MT.next = MT.ctx.currentTime + 0.05; MT.beat = 0;
  clearInterval(MT.iv);
  MT.iv = setInterval(() => {
    while (MT.next < MT.ctx.currentTime + 0.12) {
      const o = MT.ctx.createOscillator(), g = MT.ctx.createGain();
      o.frequency.value = MT.beat % 4 === 0 ? 1500 : 1000;
      g.gain.setValueAtTime(0.0001, MT.next); g.gain.exponentialRampToValueAtTime(0.5, MT.next + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, MT.next + 0.05);
      o.connect(g).connect(MT.ctx.destination); o.start(MT.next); o.stop(MT.next + 0.06);
      MT.next += 60 / MT.bpm; MT.beat++;
    }
  }, 25);
  metroPaint();
}
function metroStop() { MT.on = false; clearInterval(MT.iv); metroPaint(); }
function metroPaint() {
  const b = $('#m-go'); if (!b) return;
  b.textContent = MT.on ? 'Stop' : 'Start'; $('#m-bpm').textContent = MT.bpm;
  $('#btn-tools').classList.toggle('live', MT.on || T.running);
}
function openTools(focus) {
  const tp = $('#tools'); tp.hidden = false;
  if (focus) tp.dataset.focus = focus;
  timerPaint(); metroPaint();
}

document.addEventListener('click', async (e) => {

      setMock(m); go('setup'); break;
    }

    case 'resume': { const d = store.get(LS.draft, null); if (d) { setMock(d); S.who = d.flow === 'self' ? 'self' : 'teacher'; S.readOnly = false; go('sheet'); } break; }
    case 'history': S.histKey = null; S.histFilter = null; go('history'); break;

    case 'who': S.who = v; render(); break;

    case 'set': { const cur = sc()[b.dataset.k]; const nv = +v; setScore(b.dataset.k, cur === nv ? null : nv); break; }
    case 'nudge': {
      const cur = sc()[b.dataset.k]; const max = +b.dataset.max; const d = +v;
      let nv = cur == null ? (d > 0 ? d : 0) : cur + d;
      if (max <= 10 && d > 0 && cur != null && cur % 1) nv = cur - d; // toggle half off
      nv = Math.max(0, Math.min(max, Math.round(nv * 2) / 2));
      setScore(b.dataset.k, nv); break;
    }
    case 'cell': { const cur = sc()[b.dataset.k]; setScore(b.dataset.k, cur === 1 ? 0 : 1); break; }
    case 'rowall': {
      const sec = FORM.sections.find((x) => x.id === b.dataset.sec); const row = sec.rows.find((x) => x.id === b.dataset.row);
      const ks = cellKeys(sec, row); const all = ks.every((k) => sc()[k] === 1);

    case 'hopen': { const m = getHistory().find((x) => x.id === v); if (m) { const c = JSON.parse(JSON.stringify(m)); delete c.summary; setMock(c); S.readOnly = false; S.who = 'teacher'; go('results'); } break; }
    case 'hdel': {
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Delete?'; b.classList.add('danger'); setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = '✕'; b.classList.remove('danger'); } }, 3000); return; }
      store.set(LS.hist, getHistory().filter((x) => x.id !== v)); toast('Deleted'); render(); break;
    }
    case 'theme': {
      const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store.set(LS.theme, nx); break;
    }
    case 'tools': { const tp = $('#tools'); if (tp.hidden) openTools(); else tp.hidden = true; break; }
    case 'timer': T.limit = +v; timerReset(); openTools('timer'); break;
    case 'metro': MT.bpm = +v; openTools('metro'); metroPaint(); break;
    case 't-go': timerToggle(); metroPaint(); break;
    case 't-reset': timerReset(); metroPaint(); break;
    case 't-limit': T.limit = +v; timerPaint(); break;
    case 'm-go': MT.on ? metroStop() : metroStart(); break;
    case 'm-bpm': MT.bpm = Math.max(40, Math.min(240, v === '+' ? MT.bpm + 4 : v === '-' ? MT.bpm - 4 : +v)); if (MT.on) { metroStop(); metroStart(); } metroPaint(); break;
    case 'tools-close': $('#tools').hidden = true; break;
    case 'home': if (S.readOnly) { S.readOnly = false; window.history.replaceState(null, '', location.pathname); } go('home'); break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('input[type=range][data-k]')) { sc()[t.dataset.k] = +t.value; touch(); const it = t.closest('.item, .mcol'); const vl = it && $('.val', it); if (vl) vl.innerHTML = `${fmt(+t.value)} <small>/ ${t.max}</small>`; t.closest('.slider').classList.remove('unset'); }
  if (t.matches('textarea.cmt')) {
    if (t.dataset.overall) S.mock.overall[S.who] = t.value; else S.mock.comments[S.who][t.dataset.sec] = t.value;
    touch();
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('input[type=range][data-k]')) refreshSection(t.dataset.k.split('.')[0]);
  if (t.matches('input[name=flow]')) { $$('.radio').forEach((r) => r.classList.toggle('on', r.contains(t))); }
  if (t.id === 'import' && t.files[0]) importHistory(t.files[0]);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); $('#tools').hidden = true; } });
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
window.addEventListener('afterprint', () => { $('#print').innerHTML = ''; });

/* ---------- boot ---------- */
(async function boot() {
  const th = store.get(LS.theme, null); if (th) document.documentElement.dataset.theme = th;
  if (location.hash.startsWith('#view=')) {
    try {
      const m = await decodeShare(location.hash.slice(6));
      if (!LEVELS[m.level]) throw new Error('bad');
      setMock(m); S.readOnly = true; S.view = 'results';
    } catch (e) { toast('That share link is damaged or incomplete'); }
  }
  render();
})();

</script>
