/* ---------- quick checks: part of an audition ----------
   A quick check is a mock with `scope` = the section ids it covers. The same five TYPES work for every form,
   so a group (audition-day) session can run "Scales" for clarinets and percussion alike. Percussion also gets
   one unit per instrument (snare / mallets / timpani / xylophone). */
const QUICK_TYPES = ['scales', 'chromatic', 'etude', 'sight'];
function unitSecs(form, type) {
  const S_ = form.sections;
  if (type.startsWith('g:')) return S_.filter((s) => s.group === type.slice(2)).map((s) => s.id);
  if (type === 'scales') return S_.filter((s) => s.kind === 'windScales' || s.kind === 'malletScales').map((s) => s.id);
  if (type === 'chromatic') return S_.filter((s) => s.catKey === 'chromatic').map((s) => s.id);
  if (type === 'etude') return S_.filter((s) => s.kind === 'rubric' && !s.sightReading && !s.catKey).map((s) => s.id);
  if (type === 'sight') return S_.filter((s) => s.sightReading).map((s) => s.id);
  return [];
}
function unitLabel(form, type) {
  if (type.startsWith('g:')) return type.slice(2);
  if (type === 'scales') return form.inst === 'percussion' ? 'Mallet scales' : 'Major scales';
  if (type === 'chromatic') return 'Chromatic scale';
  if (type === 'sight') return 'Sight reading';
  if (type === 'etude') {
    if (form.inst === 'percussion') return 'Etudes';
    if (form.round === 'district') return 'Lyrical etude';
    return form.level === 'ms' ? 'Prepared selection' : 'Etudes';
  }
  return type;
}
function quickUnits(form) {
  const types = QUICK_TYPES.slice();
  if (form.inst === 'percussion') [...new Set(form.sections.map((s) => s.group))].forEach((g) => types.push('g:' + g));
  return types.map((t) => ({ id: t, label: unitLabel(form, t), secs: unitSecs(form, t) })).filter((u) => u.secs.length);
}
/** the judge sheet a mock uses: the full form, or only its quick-check sections */
function formFor(m) {
  const f = buildForm(m.level, m.round, m.inst, m.variant);
  if (!m.scope || !m.scope.length) return f;
  const sections = f.sections.filter((s) => m.scope.includes(s.id));
  if (!sections.length) return f;
  return Object.assign({}, f, { sections, max: sections.reduce((a, s) => a + s.max, 0), cut: null, fullMax: f.max,
    scope: m.scope, scopeLabel: m.scopeLabel || sections.map((s) => s.title).join(' + ') });
}

/* ============================================================
   Feedback library: maps judge-sheet categories to student-facing
   names, practice drills, and quick-tap judge comments.
   ============================================================ */

function catKeyFor(label) {
  const l = label.toLowerCase();
  if (l.startsWith('tone quality') || l === 'tone production' || l.includes('technique/tone')) return 'tone';
  if (l === 'technique' || l === 'mallet technique') return 'technique';
  if (l.startsWith('rhythmic')) return 'rhythm';
  if (l.startsWith('articulation')) return 'artic';
  if (l.startsWith('dynamics')) return 'dynamics';
  if (l.startsWith('interpretation') || l.startsWith('phrasing')) return 'interp';
  if (l.startsWith('rudiment')) return 'rudiments';
  if (l.startsWith('roll')) return 'rolls';
  if (l.startsWith('tempo/pulse')) return 'pulse';
  if (l === 'accuracy' || l === 'note accuracy') return 'accuracy';
  if (l.includes('tuning') || l.startsWith('pitch changes')) return 'tuning';
  if (l.startsWith('chromatic')) return 'chromatic';
  return 'general';
}

    tone: ['Snare: play in the center to slightly off-center for the best sound. Mallets: hit the bar center. Timpani: play a hand’s width in from the edge.'],
    pulse: ['Practice with a metronome, then with the click on beats 2 and 4 only, so you keep the time yourself.'],
  },
};
/** tips for a category: this instrument's first, then the general ones (no repeats) */
function tipsFor(catKey, inst) {
  const fam = INST_FAMILY[inst];
  const own = (fam && INST_TIPS[fam] && INST_TIPS[fam][catKey]) || [];
  const gen = (CATS[catKey] || CATS.general).tips;
  return own.concat(gen.filter((t) => !own.includes(t)));
}

/* ============================================================
   SIGHT READING: First Sight etudes inside the mock audition.
   The generator, notation, voices and click are Band Arcade's First Sight engine (vendor/first-sight/, copied
   unchanged; src/fs-shim.js gives it a sound output). This file is the mock tool's glue:
     • which First Sight instrument reads for each sight-reading section (fsMember)
     • the etude panel on the judge sheet (fsPanel) — the code is saved on the mock: m.sight = {sectionId: code}
     • the full-screen MUSIC STAND (fsOpenStand): study countdown, count-in / click, Hear It, tempo
     • the etude on results (fsResultsBlock), in the printout (fsPrintPages), and in share links (packMock 'sr')
   An etude CODE (5E6-K7QX) is the same music on every device, so a student can replay it later.
   Loaded before app.js (app.js's boot render uses these); uses app.js's S, FORM, store, esc, $, toast at call time.
   ============================================================ */
const FS = window.Arcade.FSEtudes;
const FS_DEFAULTS = { level: 5, key: 'mix', bars: 6, studyS: 30, click: false, speak: true, rec: false };
const FS_HS_NOTE = 'First Sight writes middle-school district-level etudes (concert F, B♭, E♭, A♭). They make good reading practice, but real 9–12 sight reading is harder.';
const FS_RULES = { tempoStep: 4, tempoMin: 40, tempoOver: 16, leadS: 0.25,
  gain: { p: 0.42, mp: 0.58, mf: 0.75, f: 1 }, accent: 1.3, length: { normal: 0.9, stac: 0.45, ten: 1, slur: 1 },
  clickGain: 0.5, clickDown: 0.8, minScale: 0.8 };   // the same numbers as First Sight's RULES

function fsPrefs() { return Object.assign({}, FS_DEFAULTS, (store.get(LS.prefs, {}).fs) || {}); }
function fsSavePrefs(p) { const all = store.get(LS.prefs, {}); all.fs = Object.assign(fsPrefs(), p); store.set(LS.prefs, all); }

/* which First Sight member reads this section's etude; null = none (timpani) */
const FS_MEMBER = { flute: 'flute', oboe: 'oboe', bassoon: 'bassoon', clarinet: 'clarinet', bassclar: 'basscl', altosax: 'altosax',
  tenorsax: 'tenorsax', barisax: 'barisax', trumpet: 'trumpet', horn: 'horn', trombone: 'trombone', basstrombone: 'trombone', tuba: 'tuba' };
function fsMember(form, sec, m) {
  const A = window.Arcade;
  if (form.inst === 'percussion') {
    if (sec.id.startsWith('sn')) return { member: A.memberById('snare'), label: 'Snare drum' };
    if (sec.id.startsWith('ma') || sec.id.startsWith('xy')) return { member: A.memberById('bells'), label: sec.id.startsWith('xy') ? 'Xylophone (bells part)' : 'Mallets (bells part)' };
    return null;
  }
  if (form.inst === 'baritone') {
    const clef = m.sightBari || (m.variant === 'tc' ? 'tc' : 'bc');
    return { member: A.memberById(clef === 'tc' ? 'baritonetc' : 'euphbc'), label: clef === 'tc' ? 'Baritone (treble clef)' : 'Baritone (bass clef)', bari: clef };
  }
  if (form.inst === 'contraclar') {
    const eb = m.variant === 'eb';
    return { member: A.memberById(eb ? 'barisax' : 'basscl'), label: eb ? 'E♭ Contra Clarinet' : 'B♭ Contra Clarinet', octDown: true,
      note: `Written like the ${eb ? 'baritone sax' : 'bass clarinet'} part. Hear It plays it an octave lower.` };
  }
  return { member: A.memberById(FS_MEMBER[form.inst]), label: form.instrumentLabel };
}
function fsBuild(code, info) {
  const et = FS.make(FS.parseCode(code));
  const real = FS.realize(et, info.member);
  if (info.octDown) real.notes.forEach((n) => { if (n) n.sounding -= 12; });
  return { et, real };
}
const fsPitched = (info) => info.member.pitched !== false;
function fsDescribe(et, info) {
  const L = FS.LEVELS[et.level - 1];
  return `Level ${L.n} · ${L.name} · ${fsPitched(info) ? 'Concert ' + et.keyName + ' · ' : ''}${et.meter} · ${et.bars} bars`;
}
/** a quarter (or dotted quarter) note for tempo markings, drawn (fonts draw ♩ too small) */
const fsNoteIcon = (dotted) => `<svg class="fs-q" viewBox="0 0 ${dotted ? 20 : 14} 30" aria-hidden="true"><ellipse cx="6" cy="24" rx="5.6" ry="4.2" transform="rotate(-20 6 24)" fill="currentColor"/><path d="M10.6 23V2" stroke="currentColor" stroke-width="1.8"/>${dotted ? '<circle cx="16" cy="24" r="1.9" fill="currentColor"/>' : ''}</svg>`;
const fsTempoMark = (et, bpm) => `<b>${esc(et.tempoWord)}</b> ${fsNoteIcon(et.compound)} = ${bpm || et.tempo}`;

/* ---------- engraving: rows of bars (First Sight's layout: 4 a row, 3 for 6 bars, 2 when it gets too small) ---------- */
function fsRowsOf(et, real, nb, idPrefix) {
  const rows = [];
  for (let from = 0; from < et.bars; from += nb) rows.push([from, Math.min(et.bars, from + nb)]);
  return rows.map(([from, to]) => {
    const t0 = from * et.barTicks, evs = [];
    et.events.filter((e) => e.bar >= from && e.bar < to).forEach((e) => {
      const prev = evs[evs.length - 1];
      if (e.tiedFrom && prev && prev.src.tieNext && et.events[e.i - 1].bar >= from) { prev.beats += e.d / 12; prev.tieOut = false; return; }
      const r = real.notes[e.i];
      const ev = { t: (e.t - t0) / 12, beats: e.d / 12, rest: e.rest, n: r ? r.n : null, id: e.rest ? undefined : `${idPrefix}${e.i}`, src: e,
        trip: e.trip || undefined, art: e.art.length ? e.art.slice() : undefined, dyn: e.dyn, hair: e.hair, hairEnd: e.hairEnd,
        slur: e.slur, slurFirst: e.slurFirst, slurLast: e.slurLast, tieIn: !!e.tiedFrom, tieOut: !!e.tieNext, label: '' };
      if (real.unpitched) { ev.n = null; ev.slur = undefined; ev.art = ev.art && ev.art.filter((k) => k === 'acc'); if (ev.art && !ev.art.length) ev.art = undefined; }
      evs.push(ev);
    });
    evs.forEach((ev) => { if (ev.tieOut && evs.indexOf(ev) < evs.length - 1) ev.tieOut = false; });
    return { from, to, evs, t0 };
  });
}
function fsEngrave(et, real, availW, idPrefix = 'fse') {
  const N = window.Arcade.Notation;
  const opts = (r, k, width) => ({ clef: real.clef, sig: real.sig, per: et.per, timeSig: et.ts, measures: r.to - r.from, events: r.evs,
    header: 'full', showTime: k === 0, captions: false, final: r.to === et.bars, groupBeats: 1, width,
    label: k === 0 ? `The etude, bars ${r.from + 1} to ${r.to}` : `Bars ${r.from + 1} to ${r.to}` });
  const wide = et.bars === 6 ? 3 : 4;
  let built = null, W = 0;
  // phones: 2 bars a row, or 1 when 2 would shrink the notes below 75% (dense level 5–6 bars)
  const tries = availW < 520 ? [2, 1] : [wide, 2];
  for (const nb of tries) {
    built = fsRowsOf(et, real, nb, idPrefix);
    W = Math.max(...built.map((r, k) => N.engrave(opts(r, k)).vb.w));
    if (nb === tries[tries.length - 1] || availW / W >= (availW < 520 ? 0.75 : FS_RULES.minScale)) break;
  }
  const width = Math.max(W, availW);
  return built.map((r, k) => Object.assign(r, { E: N.engrave(opts(r, k, width)) }));
}
const fsRowsHTML = (rows) => rows.map((r, k) => `<div class="fs-row" data-row="${k}">${r.E.svg}<i class="fs-marker" hidden></i></div>`).join('');

/* ---------- the panel on the judge sheet ---------- */
function fsPanel(sec) {
  const m = S.mock, info = fsMember(FORM, sec, m);
  if (!info || !info.member) {
    return `<div class="fs-box"><div class="fs-h"><b>Sight-reading etude</b></div>

  }
  const code = (m.sight || {})[sec.id];

  if (!code || !FS.parseCode(code)) return fsSetup(sec, info, hs);

  return `<div class="fs-box">
    <div class="fs-h"><b>Sight-reading etude</b><span class="fs-code" title="The same code is the same music on any device">${esc(et.code)}</span></div>
    <div class="fs-meta">${esc(info.label)} · ${esc(fsDescribe(et, info))}</div>
    ${info.note ? `<p class="help tiny">${esc(info.note)}</p>` : ''}

}
function fsSetup(sec, info, hs) {

  return `<div class="fs-box fs-setup">

    <p class="help">Generate an original etude for ${esc(info.label)} and put it on the stand when the student reaches this section. ${hs ? esc(FS_HS_NOTE) : ''}</p>
    ${info.note ? `<p class="help tiny">${esc(info.note)}</p>` : ''}
    <div class="fs-opts">
      <label class="fld"><span>Level</span><select data-fsopt="level">${FS.LEVELS.map((L) => opt(L.n, p.level, `${L.n} · ${L.name}${L.n === 5 ? ' (district audition)' : ''}`)).join('')}</select></label>
      ${pitched ? `<label class="fld"><span>Key</span><select data-fsopt="key">${opt('mix', p.key, 'Surprise me')}${FS.KEYS.map((k) => opt(k, p.key, 'Concert ' + FS.KEY_NAME[k])).join('')}</select></label>` : ''}

}
function fsGenerate(secId, keepKeyOf) {
  const p = fsPrefs(), sec = FORM.sections.find((x) => x.id === secId), info = fsMember(FORM, sec, S.mock);
  let key = p.key === 'mix' || !FS.KEYS.includes(p.key) ? FS.KEYS[Math.floor(Math.random() * FS.KEYS.length)] : p.key;
  let level = p.level, bars = p.bars;
  if (keepKeyOf) { const c = FS.parseCode(keepKeyOf); level = c.level; bars = c.bars; if (p.key !== 'mix') key = c.key; }
  if (!fsPitched(info)) key = 'Bb';

/* draw every preview on the page (after render / refreshSection) */

/* ============================================================
   THE MUSIC STAND (full screen)
   From the judge sheet it runs THE AUDITION SEQUENCE, like the real GMEA sight-reading room (Mat's spec):
     1. brief   — the music is covered; the judge reads the instructions aloud and taps ▶ Give the tempo
     2. tempo1  — 8 ticks at the etude's tempo
     3. study   — after the 8th tick the music is revealed and the study clock (30 s) starts by itself
     4. tempo2  — when time is up, 8 more ticks
     5. perform — on the beat after the 8th tick the student plays (no click, no marker)
   then Hear It / play again / start over. PRACTICE (from results) keeps the looser study → count-in → play flow.
   ============================================================ */
const FS_TICKS = 8;
const FS_JUDGE = (s) => s
  ? `You will have ${s} seconds to study this music. You may not produce a tone on your instrument during the study time. Here is the tempo:`
  : 'You may not produce a tone on your instrument until you begin. Here is the tempo:';
const FSS = { secId: null, et: null, real: null, info: null, rows: [], run: null, studyT: 0, studyLeft: 0, studyOn: false,
  played: false, hearArmed: false, bpm: 0, practice: false, click: false, studyS: 30,
  phase: 'free', tick: null };   // phase: brief | tempo1 | study | tempo2 | perform | free (practice / after the sequence)
function fsOpenStand(secId, { practice = false } = {}) {
  const sec = FORM.sections.find((x) => x.id === secId), info = fsMember(FORM, sec, S.mock);
  const code = S.mock.sight && S.mock.sight[secId];
  if (!info || !info.member || !code) return;
  fsStopRun(); fsStopStudy();
  const p = fsPrefs();
  Object.assign(FSS, fsBuild(code, info), { secId, info, practice, played: false, hearArmed: false, click: practice ? true : !!p.click, studyS: p.studyS,
    speak: !!p.speak, rec: !!p.rec && !practice && recCan() });
  if (FSS.speak && !practice) {
    if (FSS.studyS === FS_REC.studyS) fsLoadRec();                               // fetch + decode Mat's recording ahead of the tap
    try { speechSynthesis.getVoices(); } catch (e) { /* voices load in the background */ }
  }
  FSS.bpm = FSS.et.tempo;
  const el = $('#stand');
  el.innerHTML = `
    <div class="stand-top">
      <div class="stand-t"><b>${esc(practice ? 'Practice' : sec.title)}</b><span>${esc(info.label)}${practice ? ' · ' + esc(fsDescribe(FSS.et, info)) : ''}</span></div>
      <span class="fs-rec-live" id="fs-rec-live" hidden></span>
      <span class="fs-code light">${esc(FSS.et.code)}</span>
      <button class="btn sm on-navy" data-act="fsclose">${practice ? 'Close ✕' : 'Done — back to scoring ✕'}</button>
    </div>
    <div class="stand-paper fs-paper">
      <div class="fs-tempo" id="fs-tempo">${fsTempoMark(FSS.et)}</div><div class="fs-rows" id="fs-rows"></div>
      ${practice ? '' : `<div class="stand-cover" id="fs-cover">
        <div class="cover-in">
          <div class="cover-k">The judge reads aloud</div>
          <blockquote id="fs-judge">“${esc(FS_JUDGE(FSS.studyS))}”</blockquote>
          <div class="fs-ticks" id="fs-ticks1">${fsTickDots()}</div>
          <label class="cover-speak"><input type="checkbox" id="fs-speak" ${FSS.speak ? 'checked' : ''}> 🔊 Read the instructions aloud</label>
          <button class="btn gold big" id="fs-give" data-act="fsaud"></button>
          <p class="cover-help" id="fs-cover-help"></p>
        </div>
      </div>`}
    </div>
    <div class="stand-study" id="fs-study" hidden>
      <div class="fs-study-bar"><i id="fs-fill"></i></div>
      <p><b id="fs-left">30</b> <span id="fs-word">seconds to study it.</span> ${practice ? 'Find the key, the time signature, the tricky rhythms and the dynamics.' : 'No sound on the instrument yet.'}</p>
      <button class="btn ${practice ? 'gold' : 'sm'}" data-act="fsready">${practice ? 'I’m ready' : 'Skip ▸'}</button>
    </div>
    <div class="stand-ctl">
      <p class="fs-say" id="fs-say" aria-live="polite"></p>
      <div class="fs-ticks big" id="fs-ticks2" hidden>${fsTickDots()}</div>
      <div class="stand-btns">
        <button class="btn primary big" id="fs-play" data-act="fsplay">▶ Count me in</button>
        <button class="btn big" id="fs-hear" data-act="fshear">▶ Hear it</button>
      </div>
      <div class="stand-opts">
        <span class="fs-tempo-ctl"><button class="btn sm" data-act="fstempo" data-v="-4" aria-label="Slower">−</button><span id="fs-bpm"></span><button class="btn sm" data-act="fstempo" data-v="4" aria-label="Faster">+</button></span>
        <label class="fs-tg"><input type="checkbox" id="fs-click" ${FSS.click ? 'checked' : ''}> Click while playing</label>
        ${practice || !recCan() ? '' : `<label class="fs-tg"><input type="checkbox" id="fs-rec" ${FSS.rec ? 'checked' : ''}> ● Record the student</label>`}
        ${practice ? '' : '<button class="btn sm" data-act="fsrestart">↺ Start over</button>'}
        <label class="fs-tg">Study time <select id="fs-studys">${[0, 30, 60].map((s) => `<option value="${s}" ${FSS.studyS === s ? 'selected' : ''}>${s ? s + ' s' : 'Off'}</option>`).join('')}</select></label>
      </div>
    </div>`;
  el.hidden = false;
  document.body.classList.add('stand-open');

  fsDrawRows(); fsDrawTempo(); fsDrawButtons(); fsDrawCover();

  else fsSay('');
}
const fsTickDots = () => Array.from({ length: FS_TICKS }, (x, i) => `<i>${i + 1}</i>`).join('');

/* ---------- the audition sequence ---------- */
/** FS_TICKS clicks at the etude's tempo; dots in `box` light up with each tick; done() fires on the beat after the last */
function fsTickRun(box, done) {
  fsTickStop();
  const A = window.Arcade, o = A.Sfx.output(), beatS = 60 / FSS.bpm;
  const t = { raf: 0, ctx: o ? o.ctx : null, kit: null, bus: null, t0: 0, p0: performance.now(), lit: -1, done: false };
  if (t.ctx) {
    if (t.ctx.state !== 'running') t.ctx.resume().catch(() => {});
    t.bus = t.ctx.createGain(); t.bus.connect(o.out);
    t.kit = A.MHBacking.create(t.ctx, t.bus);
    t.t0 = t.ctx.currentTime + FS_RULES.leadS;
    for (let i = 0; i < FS_TICKS; i++) t.kit.click(t.t0 + i * beatS, FS_RULES.clickDown, false);
  }
  const now = () => t.ctx ? t.ctx.currentTime - (t.ctx.outputLatency || t.ctx.baseLatency || 0) - t.t0 : (performance.now() - t.p0) / 1000 - FS_RULES.leadS;
  const dots = [...box.children];
  dots.forEach((d) => d.classList.remove('on'));
  box.hidden = false;
  const frame = () => {
    if (FSS.tick !== t) return;
    const n = now(), k = n < 0 ? -1 : Math.min(FS_TICKS - 1, Math.floor(n / beatS));
    if (k !== t.lit) {
      for (let i = t.lit + 1; i <= k; i++) dots[i].classList.add('on');
      dots.forEach((d, i) => d.classList.toggle('now', i === k && n < FS_TICKS * beatS));
      t.lit = k;
    }
    if (n >= FS_TICKS * beatS) { fsTickStop(true); done(); return; }
    t.raf = requestAnimationFrame(frame);
  };
  FSS.tick = t;
  t.raf = requestAnimationFrame(frame);
}
function fsTickStop(finished) {
  const t = FSS.tick; if (!t) return;
  FSS.tick = null;
  cancelAnimationFrame(t.raf);
  if (t.kit) setTimeout(() => { try { t.kit.stopAll(); t.bus.disconnect(); } catch (e) { /* ignore */ } }, finished ? 300 : 0);
}
/* ---------- reading the judge's instructions aloud (the browser's own voice: Web Speech API, works offline) ---------- */
const fsCanSpeak = () => 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
function fsVoice() {
  let vs = [];

/* ============================================================
   RECORDING THE STUDENT
   ● Record on any section of the judge sheet, and (optionally) automatically on the music stand from "Play!".
   One recording per mock + section, kept in this browser's IndexedDB ('asm-media' → 'rec', key "mockId|secId"):

function recMime() {
  const c = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/aac', 'audio/webm', 'audio/ogg;codecs=opus'];
  for (const t of c) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) { /* ignore */ } }
  return '';
}
const recExt = (mime) => (/mp4|aac/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm');

/** ask for the microphone (music settings: no echo cancelling, noise suppression or auto-gain) */
async function recMic() {
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
}
async function recStart(secId, { autoStopS = 0 } = {}) {
  if (!recCan()) { toast('Recording isn’t supported in this browser'); return false; }
  if (REC.mr) await recStop();
  let stream;
  try { stream = await recMic(); } catch (e) { toast('Microphone blocked. Allow the microphone for this site in the browser settings.'); return false; }
  const mime = recMime();
  let mr;
  try { mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); } catch (e) { stream.getTracks().forEach((t) => t.stop()); toast('Recording couldn’t start'); return false; }
  Object.assign(REC, { mr, stream, chunks: [], key: `${S.mock.id}|${secId}`, secId, mockId: S.mock.id, t0: Date.now(), mime: mr.mimeType || mime });
  mr.ondataavailable = (e) => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  mr.start(1000);
  clearInterval(REC.iv);
  REC.iv = setInterval(recPaintLive, 500);
  clearTimeout(REC.auto);
  if (autoStopS) REC.auto = setTimeout(() => recStop(), autoStopS * 1000);
  recPaintLive(); recRefresh(secId);
  return true;
}
/** stop and save; resolves when the recording is stored */
function recStop() {
  const { mr } = REC;
  if (!mr) return Promise.resolve();
  clearInterval(REC.iv); clearTimeout(REC.auto);
  return new Promise((res) => {
    const key = REC.key, secId = REC.secId, mime = REC.mime, dur = (Date.now() - REC.t0) / 1000, stream = REC.stream;
    mr.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(REC.chunks, { type: mime || 'audio/webm' });
      Object.assign(REC, { mr: null, stream: null, chunks: [], key: null, secId: null });
      if (blob.size > 0) {
        try { await recPut(key, { blob, mime: blob.type, dur, created: Date.now() }); toast('Recording saved on this device'); }
        catch (e) { toast('Couldn’t save the recording (storage is full or blocked)'); }
      }
      recPaintLive(); recRefresh(secId);
      res();
    };
    try { mr.stop(); } catch (e) { res(); }
  });
}
const recIsOn = (secId) => !!REC.mr && REC.secId === secId && REC.mockId === (S.mock && S.mock.id);

/* ---------- UI ---------- */
/** the record button + player row inside a judge-sheet section */
function recSectionRow(sec) {
  if (!recCan() || S.readOnly) return '';
  const on = recIsOn(sec.id);
  return `<div class="rec-row" data-rec-row="${sec.id}">
    <button class="chip-btn rec-btn ${on ? 'on' : ''}" data-act="${on ? 'recstop' : 'recstart'}" data-v="${sec.id}">${on ? '■ Stop recording <span class="rec-time" data-rec-time></span>' : '● Record'}</button>
    <span class="rec-slot" data-rec-key="${esc(S.mock.id + '|' + sec.id)}"></span>
  </div>`;
}
/** fill every [data-rec-key] slot under root with a player (if a recording exists) */
async function recPaint(root = document) {
  const slots = $$('[data-rec-key]', root);
  for (const el of slots) {
    const r = await recGet(el.dataset.recKey);
    if (!el.isConnected) continue;
    if (!r || !r.blob) { el.innerHTML = el.dataset.empty || ''; continue; }
    const url = URL.createObjectURL(r.blob);
    el.innerHTML = `<audio controls preload="metadata" src="${url}"></audio>
      ${el.dataset.download ? `<a class="btn sm" href="${url}" download="${esc(el.dataset.download)}.${recExt(r.mime)}">Download</a>` : ''}
      ${S.readOnly ? '' : `<button class="btn sm ghost rec-del" data-act="recdel" data-v="${esc(el.dataset.recKey)}" aria-label="Delete recording">✕</button>`}`;
  }
}
function recRefresh(secId) { const row = $(`[data-rec-row="${secId}"]`); if (row) { row.outerHTML = recSectionRow(FORM.sections.find((s) => s.id === secId)); recPaint($(`[data-rec-row="${secId}"]`) || document); } }
function recPaintLive() {
  const s = REC.mr ? mmss(Date.now() - REC.t0) : '';
  $$('[data-rec-time]').forEach((el) => { el.textContent = s; });
  document.body.classList.toggle('recording', !!REC.mr);
  const sr = $('#fs-rec-live'); if (sr) { sr.hidden = !REC.mr; sr.textContent = REC.mr ? `● REC ${s}` : ''; }
}
/** the results-page panel: every recording for this mock */
function recResultsBlock() {
  if (!recCan() && !window.indexedDB) return '';
  const m = S.mock, base = `${(m.student.name || 'Student').replace(/[^\w\- ]+/g, '')} - ${m.date || ''}`;
  return `<section class="panel rec-panel" data-rec-panel hidden>
    <h3>Recordings</h3>
    ${FORM.sections.map((sec) => `<div class="rec-res" data-rec-res><b>${esc(sec.title)}</b>
      <span class="rec-slot" data-rec-key="${esc(m.id + '|' + sec.id)}" data-download="${esc(base + ' - ' + sec.title.replace(/[^\w\- #]+/g, ''))}"></span></div>`).join('')}
    <p class="muted small">Saved only on this device; share links and backups don’t include audio. Use Download to send one to the student.</p>
  </section>`;
}
async function recPaintResults() {
  const panel = $('[data-rec-panel]'); if (!panel) return;
  await recPaint(panel);
  let any = false;
  $$('[data-rec-res]', panel).forEach((row) => { const has = !!$('audio', row); row.hidden = !has; any = any || has; });
  panel.hidden = !any;
}
async function recUsage() {
  const all = await recAll();
  return { n: all.length, bytes: all.reduce((a, r) => a + ((r.val && r.val.blob && r.val.blob.size) || 0), 0) };
}
function recAction(a, v) {
  switch (a) {
    case 'recstart': recStart(v); return true;
    case 'recstop': recStop(); return true;
    case 'recdel': recDel(v).then(() => { const sid = v.split('|')[1]; if (S.view === 'results') recPaintResults(); else recRefresh(sid); toast('Recording deleted'); }); return true;
    case 'recclear': recAll().then((all) => Promise.all(all.map((r) => recDel(r.key)))).then(() => { toast('All recordings deleted'); render(); }); return true;
  }
  return false;
}

/* ============================================================
   GOALS: an audition date + target score per student, days left, the gap, and whether they're on pace.
   Stored on this device: localStorage 'asm.goals.v1' = { [studentKey]: { date, target } }.
   A default audition date (prefs.auditionDate) covers every student without their own date, since a whole
   class usually auditions the same day. The default target is the instrument's recommendation line.
   "On pace" fits a straight line through the student's FULL mocks (score vs. date) and projects it to audition day.
   ============================================================ */
const LS_GOALS = 'asm.goals.v1';
function goalOf(key) {
  const g = (store.get(LS_GOALS, {}) || {})[key] || {};
  const def = store.get(LS.prefs, {}).auditionDate || '';
  return { date: g.date || def, ownDate: !!g.date, target: g.target != null && g.target !== '' ? +g.target : null };
}
function setGoal(key, patch) {
  const all = store.get(LS_GOALS, {}) || {};
  all[key] = Object.assign({}, all[key] || {}, patch);
  store.set(LS_GOALS, all);
}
function daysUntil(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(y, m - 1, d), now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((t - now) / 864e5);
}
const dayNum = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
/** pace for a student's full mocks of one combo: { n, latest, target, gap, days, slopeWeek, projected, onPace } */
function goalStatus(key, mocks, cut) {
  const g = goalOf(key);
  const target = g.target != null ? g.target : cut;
  const full = mocks.filter((m) => !m.scope && m.date).map((m) => ({ d: m.date, t: (m.summary || summarize(m)).total }))
    .sort((a, b) => a.d.localeCompare(b.d));
  const out = { goal: g, target, days: daysUntil(g.date), n: full.length, latest: full.length ? full[full.length - 1].t : null };
  if (out.latest != null && target != null) out.gap = target - out.latest;
  const xs = [...new Set(full.map((p) => p.d))];
  if (full.length >= 2 && xs.length >= 2) {
    const X = full.map((p) => dayNum(p.d)), Y = full.map((p) => p.t);
    const mx = X.reduce((a, b) => a + b, 0) / X.length, my = Y.reduce((a, b) => a + b, 0) / Y.length;
    const sxx = X.reduce((a, x) => a + (x - mx) ** 2, 0), sxy = X.reduce((a, x, i) => a + (x - mx) * (Y[i] - my), 0);
    const slope = sxx ? sxy / sxx : 0;
    out.slopeWeek = slope * 7;
    if (g.date && target != null) {
      out.projected = my + slope * (dayNum(g.date) - mx);
      out.onPace = out.projected >= target;
    }
  }
  return out;
}
/** the goal card on a student's history page */
function goalCard(key, mocks, cut, max) {
  const st = goalStatus(key, mocks, cut);
  const g = st.goal;
  const line = [];
  if (st.days != null) line.push(st.days > 1 ? `<b>${st.days} days</b> to audition day` : st.days === 1 ? '<b>Tomorrow</b> is audition day' : st.days === 0 ? '<b>Audition day is today</b>' : 'Audition day has passed');
  if (st.latest != null) line.push(`latest full mock <b>${fmt(st.latest, 1)}</b>`);
  if (st.gap != null) line.push(st.gap > 0 ? `<b>${fmt(st.gap, 1)} points</b> to the target` : '<b>at or above the target</b>');
  let pace = '';
  if (st.slopeWeek != null) {
    const trend = `${st.slopeWeek >= 0 ? '+' : ''}${fmt(st.slopeWeek, 1)} points a week`;
    if (st.projected != null) {
      pace = `<div class="pace ${st.onPace ? 'ok' : 'behind'}"><b>${st.onPace ? 'On pace' : 'Behind pace'}</b> · trend ${trend} · projected ${fmt(Math.min(max, Math.max(0, st.projected)), 1)} on audition day${st.onPace ? '' : `, short of ${fmt(st.target, 1)}`}</div>`;
    } else pace = `<div class="pace">Trend ${trend}. Set an audition date to see if they’re on pace.</div>`;
  } else if (st.n === 1) pace = '<div class="pace">Run another full mock on a later day to see the trend.</div>';
  return `<div class="goal-card">
    <div class="goal-fields">
      <label class="fld"><span>Audition day</span><input type="date" data-goal="date" value="${esc(g.date)}"></label>
      <label class="fld"><span>Target score</span><input type="number" inputmode="decimal" min="0" max="${max}" step="0.5" data-goal="target" value="${g.target != null ? g.target : ''}" placeholder="${cut != null ? fmt(cut) + ' (line)' : 'none'}"></label>
      <button class="btn sm ghost" data-act="goalall" title="Use this audition day for every student without their own">Use this date for everyone</button>
    </div>
    ${line.length ? `<p class="goal-line">${line.join(' · ')}</p>` : '<p class="goal-line muted">Set the audition day and a target to track the countdown.</p>'}
    ${pace}
  </div>`;
}
/** one line for the results page (full mocks of a student who has a goal or date) */
function goalResultLine(m, total) {
  if (m.scope) return '';
  const key = studentKey(m), g = goalOf(key);
  const f = buildForm(m.level, m.round, m.inst, m.variant);
  const target = g.target != null ? g.target : null;
  const d = daysUntil(g.date);
  if (target == null && d == null) return '';
  const bits = [];
  if (d != null && d >= 0) bits.push(`${d} day${d === 1 ? '' : 's'} until audition day`);
  if (target != null && target !== f.cut) bits.push(total >= target ? `${fmt(total - target, 2)} above the goal of ${fmt(target)}` : `${fmt(target - total, 2)} below the goal of ${fmt(target)}`);
  return bits.length ? `<p class="goal-res">🎯 ${bits.join(' · ')}</p>` : '';
}

/* ============================================================
   AUDITION DAY: score a whole group back to back.
   Setup (view 'session'): grade band, round, what to check (full audition or a quick check type), a pasted roster
   (one student per line; ", Instrument" overrides the default instrument), and whether everyone gets the same
   sight-reading etude (like a real audition room).
   Running: the judge sheet shows a queue bar (◀ Prev · jump list · Next ▶). Each student is a normal mock tagged
   m.session = session id, saved to history when scored. Summary (view 'summary'): ranked table, print, CSV.
   localStorage 'asm.session.v1' holds the one active session.
   ============================================================ */
const LS_SESSION = 'asm.session.v1';
const sessGet = () => store.get(LS_SESSION, null);
const sessSet = (s) => store.set(LS_SESSION, s);
function sessActive() { const s = sessGet(); return s && !s.ended ? s : null; }
const SESS_TYPES = [['full', 'Full audition'], ['scales', 'Scales'], ['chromatic', 'Chromatic'], ['etude', 'Etude'], ['sight', 'Sight reading']];
function sessTypeLabel(ss) {
  if (ss.type === 'full') return 'Full audition';
  return unitLabel(buildForm(ss.level, ss.round, 'clarinet', null), ss.type);
}
function sessTypesFor(level, round) {
  const f = buildForm(level, round, 'clarinet', null);
  return SESS_TYPES.filter(([t]) => t === 'full' || unitSecs(f, t).length);
}
/* ---------- roster parsing ---------- */
const INST_ALIASES = { fl: 'flute', flute: 'flute', ob: 'oboe', oboe: 'oboe', bsn: 'bassoon', bassoon: 'bassoon', cl: 'clarinet', clar: 'clarinet', clarinet: 'clarinet',
  'bass cl': 'bassclar', 'bass clar': 'bassclar', 'bass clarinet': 'bassclar', bcl: 'bassclar', contra: 'contraclar', 'contra clarinet': 'contraclar',
  alto: 'altosax', 'alto sax': 'altosax', 'alto saxophone': 'altosax', as: 'altosax', tenor: 'tenorsax', 'tenor sax': 'tenorsax', 'tenor saxophone': 'tenorsax', ts: 'tenorsax',
  bari: 'barisax', 'bari sax': 'barisax', 'baritone sax': 'barisax', 'baritone saxophone': 'barisax', tpt: 'trumpet', trumpet: 'trumpet', cornet: 'trumpet',
  hn: 'horn', horn: 'horn', 'french horn': 'horn', tbn: 'trombone', trombone: 'trombone', 'bass trombone': 'basstrombone', 'bass tbn': 'basstrombone',
  bar: 'baritone', baritone: 'baritone', euph: 'baritone', euphonium: 'baritone', tuba: 'tuba', perc: 'percussion', percussion: 'percussion', drums: 'percussion' };
function parseRoster(text, defInst, level) {
  return text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((line) => {
    const parts = line.split(/\s*[,\t]\s*/);
    let inst = defInst;
    if (parts.length > 1) {
      const k = parts.slice(1).join(' ').toLowerCase().replace(/[^a-z ]/g, '').trim();
      if (INST_ALIASES[k]) inst = INST_ALIASES[k];
    }
    if (inst === 'basstrombone' && level === 'ms') inst = 'trombone';
    return { name: parts[0], inst, mockId: null };
  });
}

/* ---------- setup view ---------- */

}

  <div class="formcard sess-form">

      <label class="fld"><span>Date</span><input type="date" data-ss="date" value="${esc(d.date)}"></label>
      <label class="fld wide"><span>Judge / teacher</span><input data-ss="judge" value="${esc(d.judge)}"></label>
      <label class="fld wide"><span>Students — one per line${n ? ` (${n})` : ''}</span>
        <textarea data-ss="roster" rows="8" placeholder="Jordan Rivers&#10;Avery Stone&#10;Sam Lee, Trumpet">${esc(d.roster)}</textarea>
        <small class="muted">Add a comma and an instrument to change one student’s instrument: <i>Sam Lee, Alto Sax</i>.</small></label>
    </div>

}
function sessStart() {
  const d = sessDraft();
  const students = parseRoster(d.roster, d.inst, d.level);
  if (!students.length) { toast('Add at least one student'); return; }
  const prefs = store.get(LS.prefs, {}); prefs.judge = d.judge; store.set(LS.prefs, prefs);
  sessSet({ id: uid(), created: Date.now(), level: d.level, round: d.round, type: d.type, share: d.type === 'full' || d.type === 'sight' ? d.share : false,
    codes: {}, judge: d.judge, date: d.date, students, idx: 0 });
  sessOpen(0);
}
/** open student i of the active session on the judge sheet */
function sessOpen(i) {
  const ss = sessActive(); if (!ss) return;
  i = Math.max(0, Math.min(ss.students.length - 1, i));
  ss.idx = i;
  const st = ss.students[i];
  let m = null;
  if (st.mockId) {
    const h = getHistory().find((x) => x.id === st.mockId) || (store.get(LS.draft, {}) || {}).id === st.mockId && store.get(LS.draft, null);
    if (h) { m = JSON.parse(JSON.stringify(h)); delete m.summary; }
  }
  if (!m) {
    S.pick = { level: ss.level, inst: st.inst, round: ss.round, variant: null };
    const dv = ss.level === 'ms' && ss.round === 'district' && MS_DISTRICT[st.inst];
    if (dv && dv.variants) S.pick.variant = dv.defaultVariant;
    m = newMock();
    Object.assign(m, { session: ss.id, judge: ss.judge, date: ss.date });
    m.student.name = st.name;
    if (ss.type !== 'full') {
      const f = buildForm(m.level, m.round, m.inst, m.variant);
      const secs = unitSecs(f, ss.type);
      if (secs.length) { m.scope = secs; m.scopeLabel = unitLabel(f, ss.type); }
    }
    st.mockId = m.id;
  }
  sessSet(ss);
  if (ss.share) Object.entries(ss.codes || {}).forEach(([sid, code]) => { if (!m.sight[sid]) m.sight[sid] = code; });
  setMock(m); S.who = 'teacher'; S.readOnly = false;
  go('sheet');
}
/** keep the shared etude codes in step with the current student's mock */
function sessSync() {
  const ss = sessActive(); const m = S.mock;
  if (!ss || !m || m.session !== ss.id || !ss.share) return;
  const codes = Object.assign({}, ss.codes || {});
  let changed = false;
  Object.entries(m.sight || {}).forEach(([sid, code]) => { if (codes[sid] !== code) { codes[sid] = code; changed = true; } });
  if (changed) { ss.codes = codes; sessSet(ss); }
}
function sessSaveCurrent() {
  const m = S.mock; if (!m || !m.session) return;
  if (hasScores('teacher') || hasScores('self')) saveToHistory(m, true);
  else store.set(LS.draft, m);
}
function sessMockFor(st) { return st.mockId ? getHistory().find((x) => x.id === st.mockId) : null; }

/** the queue bar on the judge sheet / results for a session mock */
function sessBar() {

      ${next ? '<button class="btn sm on-navy" data-act="sssummary">Summary</button>' : ''}

/* ---------- summary ---------- */
function sessRows(ss) {
  return ss.students.map((st, k) => {
    const h = sessMockFor(st);
    if (!h || !Object.values(h.scores.teacher || {}).concat(Object.values(h.scores.self || {})).some((v) => v != null)) return { k, st, scored: false };
    const f = formFor(h), who = Object.values(h.scores.teacher || {}).some((v) => v != null) ? 'teacher' : 'self';
    const r = scoreForm(f, h.scores[who]), an = analyze(f, h.scores[who]);
    const focus = an.focus[0] ? (CATS[an.focus[0].key] || CATS.general).name : '';
    return { k, st, scored: true, total: r.total, max: r.max, pct: pct(r.total, r.max), cut: f.cut, focus, blanks: r.cells - r.done, inst: f.instrumentLabel };
  });
}
function viewSummary() {
  const ss = sessGet();

/* ---------- scoring ---------- */
function cellKeys(sec, r) {
  const k = [];
  for (let i = 1; i <= r.oct; i++) k.push(`${sec.id}.${r.id}.a${i}`);
  for (let i = 1; i <= r.oct; i++) k.push(`${sec.id}.${r.id}.d${i}`);
  k.push(`${sec.id}.${r.id}.arp`);
  return k;
}
function sectionKeys(sec) {
  if (sec.kind === 'windScales') return sec.rows.flatMap((r) => cellKeys(sec, r));
  if (sec.kind === 'malletScales') return sec.rows.flatMap((r) => [`${sec.id}.${r.id}.s`, `${sec.id}.${r.id}.a`]);
  return sec.items.map((it) => `${sec.id}.${it.id}`);
}
function scoreSection(sec, s) {
  const keys = sectionKeys(sec);
  let done = keys.filter((k) => s[k] != null).length;
  /* wind scale boxes default to 0: once any box in the section is tapped, every box counts as scored */
  if (sec.kind === 'windScales' && done) done = keys.length;
  const raw = keys.reduce((a, k) => a + (s[k] || 0), 0);
  const total = sec.kind === 'windScales' ? raw * sec.factor : raw;
  return { sec, raw, total, max: sec.max, done, cells: keys.length };
}
function scoreForm(form, s) {
  const sections = form.sections.map((sec) => scoreSection(sec, s));
  return {
    sections, total: sections.reduce((a, x) => a + x.total, 0), max: form.max,
    done: sections.reduce((a, x) => a + x.done, 0), cells: sections.reduce((a, x) => a + x.cells, 0),
  };
}
function hasScores(who) { return S.mock && Object.values(S.mock.scores[who] || {}).some((v) => v != null); }

/* category roll-up across sections (scored items only) */
function categoryStats(form, s) {
  const m = {};
  const add = (key, got, max, ctx) => {
    if (!m[key]) m[key] = { key, got: 0, max: 0, ctx: [] };
    m[key].got += got; m[key].max += max; if (ctx && !m[key].ctx.includes(ctx)) m[key].ctx.push(ctx);
  };
  form.sections.forEach((sec) => {
    const r = scoreSection(sec, s);
    if (sec.kind === 'windScales' || sec.kind === 'malletScales') {
      if (r.done) add(sec.catKey, r.total, sec.max * (r.done / r.cells), sec.group || null);
      return;
    }
    sec.items.forEach((it) => {
      const v = s[`${sec.id}.${it.id}`];
      if (v == null) return;
      add(it.catKey || catKeyFor(it.label), v, it.max, sec.title.replace(/^.*— /, ''));
    });
  });
  return Object.values(m).filter((x) => x.max > 0).map((x) => ({ ...x, pct: pct(x.got, x.max) }));
}
/* every box left blank, with a readable label; scaleCell = a scale octave/arpeggio box */
function blankItems(form, s) {
  const out = [];
  form.sections.forEach((sec) => {
    const short = sec.title.replace(/^.*— /, '');
    if (sec.kind === 'windScales') {
      /* unmarked boxes are 0 points; only flag a scale section where nothing at all was tapped */
      const keys = sectionKeys(sec);
      if (!keys.some((k) => s[k] != null)) out.push({ k: keys[0], secId: sec.id, scaleCell: false, label: `${sec.title} (nothing marked)` });
    } else if (sec.kind === 'malletScales') {
      sec.rows.forEach((row) => [['s', 'scale'], ['a', 'arpeggio']].forEach(([p, what]) => {
        const k = `${sec.id}.${row.id}.${p}`;
        if (s[k] == null) out.push({ k, secId: sec.id, scaleCell: true, label: `${row.concert} ${what} (mallets)` });
      }));
    } else {
      sec.items.forEach((it) => {
        const k = `${sec.id}.${it.id}`;
        if (s[k] == null) out.push({ k, secId: sec.id, scaleCell: false, label: sec.items.length > 1 ? `${short} · ${it.label}` : short });
      });
    }
  });
  return out;
}
/* set blank scale boxes to 0 (✗). secId limits it to one section. Returns how many changed. */
function zeroBlankScales(s, secId) {
  let n = 0;
  blankItems(FORM, s).forEach((b) => {
    if (!b.scaleCell || (secId && b.secId !== secId)) return;
    s[b.k] = 0; n++;
  });
  return n;
}
function scaleMisses(form, s) {
  const out = [];
  form.sections.forEach((sec) => {
    if (sec.kind === 'windScales') {
      if (!sectionKeys(sec).some((k) => s[k] != null)) return; // section not scored yet
      sec.rows.forEach((r) => {
        const miss = [];
        for (let i = 1; i <= r.oct; i++) if (s[`${sec.id}.${r.id}.a${i}`] !== 1) miss.push(r.oct > 1 ? `up oct ${i}` : 'ascending');
        for (let i = 1; i <= r.oct; i++) if (s[`${sec.id}.${r.id}.d${i}`] !== 1) miss.push(r.oct > 1 ? `down oct ${i}` : 'descending');
        if (s[`${sec.id}.${r.id}.arp`] !== 1) miss.push('arpeggio');
        if (miss.length) out.push({ key: keyLabel(r), miss });
      });
    } else if (sec.kind === 'malletScales') {
      sec.rows.forEach((r) => {
        const sv = s[`${sec.id}.${r.id}.s`], av = s[`${sec.id}.${r.id}.a`]; const miss = [];
        if (sv != null && sv < sec.scaleMax) miss.push(`scale ${fmt(sv)}/${sec.scaleMax}`);
        if (av != null && av < sec.arpMax) miss.push(`arpeggio ${fmt(av)}/${sec.arpMax}`);
        if (miss.length) out.push({ key: r.concert, miss });
      });
    }
  });
  return out;
}
function keyLabel(r) { return r.written ? `${r.concert} (${r.written})` : r.concert; }

function b64u(bytes) { let s = ''; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

}

    j: m.judge, d: m.date, t: strip(m.scores.teacher), s: opts.self ? strip(m.scores.self) : {},
    ct: strip(m.comments.teacher), cs: opts.self ? strip(m.comments.self) : {}, ot: m.overall.teacher, os: opts.self ? m.overall.self : '',
    sr: strip(m.sight), sb: m.sightBari || undefined, sc: m.scope || undefined, sl: m.scopeLabel || undefined,
  };
}
function unpackMock(p) {
  return {
    id: p.id || uid(), v: 1, created: Date.now(), updated: Date.now(), level: p.l, round: p.r, inst: p.i, variant: p.va || null,
    student: { name: p.n || '', school: p.sch || '', grade: p.g || '' }, judge: p.j || '', date: p.d || '',
    flow: 'teacher', scores: { teacher: p.t || {}, self: p.s || {} }, comments: { teacher: p.ct || {}, self: p.cs || {} },
    overall: { teacher: p.ot || '', self: p.os || '' }, saved: false, sight: p.sr || {}, sightBari: p.sb || undefined,
    scope: p.sc || undefined, scopeLabel: p.sl || undefined,

}
async function encodeShare(m, opts) {
  const bytes = new TextEncoder().encode(JSON.stringify(packMock(m, opts)));
  if (window.CompressionStream) {

}

}

function sectionInner(sec) {
  const s = sc(); const r = scoreSection(sec, s);
  const prog = r.cells ? Math.round((r.done / r.cells) * 100) : 0;
  let body = '';
  if (sec.kind === 'windScales') body = windScalesBody(sec, s, r);
  else if (sec.kind === 'malletScales') body = malletBody(sec, s);
  else body = sec.items.map((it) => rubricItem(sec, it, s[`${sec.id}.${it.id}`])).join('');
  const cmt = S.mock.comments[S.who][sec.id] || '';
  const quick = quickFor(sec, FORM);
  const tools = [];
  if (sec.timeLimit) tools.push(`<button class="chip-btn" data-act="timer" data-v="${sec.timeLimit}">⏱ Time limit ${mmss(sec.timeLimit * 1000)}</button>`);
  if (sec.tempo) tools.push(`<button class="chip-btn" data-act="metro" data-v="${sec.tempo}" aria-label="Metronome at ${sec.tempo}">${fsNoteIcon(false)} = ${sec.tempo}</button>`);
  if (sec.kind === 'windScales' || sec.kind === 'malletScales') {
    tools.push(`<button class="chip-btn" data-act="allperfect" data-v="${sec.id}">Start from perfect</button>`);
    if (sec.kind === 'malletScales' && r.done < r.cells) tools.push(`<button class="chip-btn" data-act="blankzero" data-v="${sec.id}" title="Every blank box in this section becomes ✗ (0 points)">Mark blanks ✗</button>`);
  }
  return `
    <div class="sec-h">
      <h3>${esc(sec.title)}</h3>
      <div class="sec-score"><span>${fmt(r.total, 2)}</span> / ${fmt(sec.maxLabel || sec.max, 2)}</div>
    </div>
    <div class="progress" title="${r.done} of ${r.cells} scored"><i style="width:${prog}%"></i></div>
    ${sec.help ? `<p class="help">${esc(sec.help)}</p>` : ''}
    ${tools.length ? `<div class="sec-tools">${tools.join('')}</div>` : ''}
    ${recSectionRow(sec)}
    ${sec.sightReading ? fsPanel(sec) : ''}
    <div class="sec-body">${body}</div>
    <details class="cmt-wrap" ${cmt ? 'open' : ''}><summary>Comments${cmt ? ' ✎' : ''}</summary>
      <div class="quick">${quick.map((q) => `<button class="qc" data-act="quick" data-sec="${sec.id}" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <textarea class="cmt" data-sec="${sec.id}" rows="2" placeholder="Notes for the student">${esc(cmt)}</textarea>
    </details>`;
}

function windScalesBody(sec, s, r) {
  const rows = sec.rows.map((row) => {
    const ks = cellKeys(sec, row);
    const rr = ks.reduce((a, k) => a + (s[k] || 0), 0);
    const cell = (k, label) => { const v = s[k]; return `<button class="cell ${v === 1 ? 'ok' : ''}" data-act="cell" data-k="${k}" aria-label="${label}${v === 1 ? ' — correct' : ' — 0 points'}" aria-pressed="${v === 1}">${v === 1 ? '✓' : label}</button>`; };
    const up = []; const dn = [];
    for (let i = 1; i <= row.oct; i++) { up.push(cell(`${sec.id}.${row.id}.a${i}`, row.oct > 1 ? String(i) : '↑')); dn.push(cell(`${sec.id}.${row.id}.d${i}`, row.oct > 1 ? String(i) : '↓')); }
    return `<div class="srow">
      <div class="skey"><b>${row.concert}</b>${row.written ? `<small>(${row.written})</small>` : ''}<span class="oct">${row.oct} oct</span></div>
      <div class="cg"><span>Up</span>${up.join('')}</div>
      <div class="cg"><span>Down</span>${dn.join('')}</div>
      <div class="cg"><span>Arp</span>${cell(`${sec.id}.${row.id}.arp`, '•')}</div>
      <div class="stot">${rr}<small>/${2 * row.oct + 1}</small></div>
      <button class="rowbtn" data-act="rowall" data-sec="${sec.id}" data-row="${row.id}" title="Mark this whole scale correct (tap again to clear)">✓ all</button>
    </div>`;
  }).join('');
  return `${rows}<div class="factor">Raw ${r.raw} / ${sec.rawMax} × ${sec.factor.toFixed(4)} = <strong>${fmt(r.total, 2)}</strong></div>
    <p class="help tiny">Every box starts at 0 points. Tap a box for <b>✓</b> when that octave or arpeggio was played correctly; tap again to take it back. Written keys (in parentheses) are for transposing instruments.</p>`;
}
function malletBody(sec, s) {
  return sec.rows.map((row) => `<div class="mrow"><div class="skey"><b>${row.concert}</b></div>
    <div class="mcol"><span class="lbl">Scale</span>${scoreWidget(`${sec.id}.${row.id}.s`, s[`${sec.id}.${row.id}.s`], sec.scaleMax, 0.5)}</div>
    <div class="mcol"><span class="lbl">Arpeggio</span>${scoreWidget(`${sec.id}.${row.id}.a`, s[`${sec.id}.${row.id}.a`], sec.arpMax, 0.5)}</div></div>`).join('');
}
function rubricItem(sec, it, v) {
  return `<div class="item"><div class="item-h"><span>${esc(it.label)}</span><span class="val">${v == null ? '—' : fmt(v)} <small>/ ${it.max}</small></span></div>
    ${scoreWidget(`${sec.id}.${it.id}`, v, it.max, it.step)}</div>`;
}
function scoreWidget(key, v, max, step) {
  const n = Math.round(max / step);
  if (n <= 10) {
    let h = '';
    for (let i = 0; i <= n; i++) { const x = i * step; h += `<button class="sc ${v === x ? 'on' : ''}" data-act="set" data-k="${key}" data-v="${x}">${fmt(x)}</button>`; }
    return `<div class="scale-chips">${h}</div>`;
  }
  if (max <= 10) {
    let h = '';
    for (let i = 0; i <= max; i++) { const on = v != null && Math.floor(v) === i; h += `<button class="sc ${on ? 'on' : ''} ${on && v % 1 ? 'half' : ''}" data-act="set" data-k="${key}" data-v="${i}">${i}${on && v % 1 ? '½' : ''}</button>`; }
    return `<div class="scale-chips int">${h}<button class="sc nudge" data-act="nudge" data-k="${key}" data-v="${step}" data-max="${max}" aria-label="Add half point">+½</button></div>`;
  }
  return `<div class="slider ${v == null ? 'unset' : ''}">
    <button class="sc nudge" data-act="nudge" data-k="${key}" data-v="${-step}" data-max="${max}" aria-label="Minus half point">−</button>
    <input type="range" min="0" max="${max}" step="${step}" value="${v == null ? 0 : v}" data-k="${key}" aria-label="score">

function analyze(form, s) {

  const strengths = cats.filter((c) => c.pct >= 70).slice(0, 3);
  const focus = cats.slice().sort((a, b) => a.pct - b.pct || (b.max - b.got) - (a.max - a.got))
    .filter((c) => c.pct < 90 && !strengths.includes(c)).slice(0, 3);
  const misses = scaleMisses(form, s);
  /* sight reading vs prepared music, scored items only */
  const part = (secs) => {
    let got = 0, max = 0;
    secs.forEach((sec) => sec.items.forEach((it) => { const v = s[`${sec.id}.${it.id}`]; if (v != null) { got += v; max += it.max; } }));
    return max ? pct(got, max) : null;
  };
  const sp = part(form.sections.filter((x) => x.sightReading));
  const pp = part(form.sections.filter((x) => !x.sightReading && x.kind === 'rubric' && !x.catKey));
  const srGap = sp != null && pp != null && pp - sp >= 12 ? { sp, pp } : null;
  return { cats, strengths, focus, misses, srGap, plan: practicePlan(focus, srGap, misses, form.inst) };
}

function histSeriesOptions(combo) {

function histPoints(mocks, series, combo) {

function importHistory(file) {

    try {
      const d = JSON.parse(rd.result); const inc = Array.isArray(d) ? d : d.mocks;
      if (!Array.isArray(inc)) throw new Error('bad');
      const h = getHistory(); let added = 0, upd = 0;
      inc.forEach((m) => {
        if (!m || !m.id || !m.level || !LEVELS[m.level]) return;
        const i = h.findIndex((x) => x.id === m.id);

function printTicks(max, step, v) {
  const ticks = [];
  for (let x = 0; x <= max + 1e-9; x += step) ticks.push(Math.round(x * 100) / 100);
  let placed = v == null;
  const out = [];
  ticks.forEach((t, i) => {
    if (!placed && v < t && (i === 0 || v > ticks[i - 1])) { out.push(`<b class="circ">${fmt(v)}</b>`); placed = true; }
    out.push(v === t ? `<b class="circ">${fmt(t)}</b>` : `<span>${fmt(t)}</span>`);
    if (v === t) placed = true;
  });
  return out.join('<i> . . . </i>');
}

const T = { start: 0, acc: 0, running: false, limit: 0, iv: null };
function timerNow() { return T.acc + (T.running ? Date.now() - T.start : 0); }
function timerPaint() {
  const el = $('#t-time'); if (!el) return;
  const ms = timerNow(); el.textContent = mmss(ms);
  el.classList.toggle('over', !!T.limit && ms > T.limit * 1000);
  $('#t-limit').textContent = T.limit ? `limit ${mmss(T.limit * 1000)}` : 'no limit';
  $('#t-go').textContent = T.running ? 'Pause' : timerNow() ? 'Resume' : 'Start';
}
function timerToggle() {
  if (T.running) { T.acc = timerNow(); T.running = false; clearInterval(T.iv); }
  else { T.start = Date.now(); T.running = true; T.iv = setInterval(timerPaint, 200); }
  timerPaint();
}
function timerReset() { T.running = false; T.acc = 0; clearInterval(T.iv); timerPaint(); }

const MT = { ctx: null, on: false, bpm: 120, next: 0, iv: null, beat: 0 };
function metroStart() {
  if (!MT.ctx) MT.ctx = new (window.AudioContext || window.webkitAudioContext)();
  MT.ctx.resume(); MT.on = true; MT.next = MT.ctx.currentTime + 0.05; MT.beat = 0;
  clearInterval(MT.iv);
  MT.iv = setInterval(() => {
    while (MT.next < MT.ctx.currentTime + 0.12) {
      const o = MT.ctx.createOscillator(), g = MT.ctx.createGain();
      o.frequency.value = MT.beat % 4 === 0 ? 1500 : 1000;
      g.gain.setValueAtTime(0.0001, MT.next); g.gain.exponentialRampToValueAtTime(0.5, MT.next + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, MT.next + 0.05);
      o.connect(g).connect(MT.ctx.destination); o.start(MT.next); o.stop(MT.next + 0.06);
      MT.next += 60 / MT.bpm; MT.beat++;
    }
  }, 25);
  metroPaint();
}
function metroStop() { MT.on = false; clearInterval(MT.iv); metroPaint(); }
function metroPaint() {
  const b = $('#m-go'); if (!b) return;
  b.textContent = MT.on ? 'Stop' : 'Start'; $('#m-bpm').textContent = MT.bpm;
  $('#btn-tools').classList.toggle('live', MT.on || T.running);
}
function openTools(focus) {
  const tp = $('#tools'); tp.hidden = false;
  if (focus) tp.dataset.focus = focus;
  timerPaint(); metroPaint();
}

document.addEventListener('click', async (e) => {

      if (v === 'district' && d && d.variants && !S.pick.variant) S.pick.variant = d.defaultVariant;

      toast(`Audition day ${fmtDate(g.date)} set for every student without their own`); render(); break;
    }
    case 'hopen': { const m = getHistory().find((x) => x.id === v); if (m) { const c = JSON.parse(JSON.stringify(m)); delete c.summary; setMock(c); S.readOnly = false; S.who = 'teacher'; go('results'); } break; }
    case 'hdel': {
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Delete?'; b.classList.add('danger'); setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = '✕'; b.classList.remove('danger'); } }, 3000); return; }
      store.set(LS.hist, getHistory().filter((x) => x.id !== v)); recDeleteMock(v); toast('Deleted'); render(); break;
    }
    case 'theme': {
      const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store.set(LS.theme, nx); break;
    }
    case 'tools': { const tp = $('#tools'); if (tp.hidden) openTools(); else tp.hidden = true; break; }
    case 'timer': T.limit = +v; timerReset(); openTools('timer'); break;
    case 'metro': MT.bpm = +v; openTools('metro'); metroPaint(); break;
    case 't-go': timerToggle(); metroPaint(); break;
    case 't-reset': timerReset(); metroPaint(); break;
    case 't-limit': T.limit = +v; timerPaint(); break;
    case 'm-go': MT.on ? metroStop() : metroStart(); break;
    case 'm-bpm': MT.bpm = Math.max(40, Math.min(240, v === '+' ? MT.bpm + 4 : v === '-' ? MT.bpm - 4 : +v)); if (MT.on) { metroStop(); metroStart(); } metroPaint(); break;
    case 'tools-close': $('#tools').hidden = true; break;
    case 'home': if (S.readOnly) { S.readOnly = false; window.history.replaceState(null, '', location.pathname); } go('home'); break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('input[type=range][data-k]')) { sc()[t.dataset.k] = +t.value; touch(); const it = t.closest('.item, .mcol'); const vl = it && $('.val', it); if (vl) vl.innerHTML = `${fmt(+t.value)} <small>/ ${t.max}</small>`; t.closest('.slider').classList.remove('unset'); }
  if (t.matches('[data-ss]') && t.type !== 'checkbox' && t.tagName !== 'SELECT') { sessInput(t); return; }
  if (t.matches('textarea.cmt')) {
    if (t.dataset.overall) S.mock.overall[S.who] = t.value; else S.mock.comments[S.who][t.dataset.sec] = t.value;
    touch();
  }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-fscode]');
  if (f) { e.preventDefault(); fsSubmit(f); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (fsChange(t)) return;
  if (sessInput(t)) return;
  if (t.matches('[data-goal]')) {
    const k = t.dataset.goal;
    if (k === 'date') setGoal(S.histKey, { date: t.value });
    else setGoal(S.histKey, { target: t.value === '' ? null : Math.max(0, +t.value) });
    render(); return;
  }
  if (t.matches('input[type=range][data-k]')) refreshSection(t.dataset.k.split('.')[0]);
  if (t.matches('input[name=flow]')) { $$('.radio').forEach((r) => r.classList.toggle('on', r.contains(t))); }
  if (t.id === 'import' && t.files[0]) importHistory(t.files[0]);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('#stand').hidden) { fsCloseStand(); return; } closeModal(); $('#tools').hidden = true; }
});
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
window.addEventListener('afterprint', () => { $('#print').innerHTML = ''; });

/* ---------- boot ---------- */
(async function boot() {
  const th = store.get(LS.theme, null); if (th) document.documentElement.dataset.theme = th;
  /* offline: the service worker caches the app after the first visit (https or localhost only) */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline mode unavailable; the app still works online */ });
  }
  if (location.hash.startsWith('#view=')) {
    try {
      const m = await decodeShare(location.hash.slice(6));
      if (!LEVELS[m.level]) throw new Error('bad');
      setMock(m); S.readOnly = true; S.view = 'results';
    } catch (e) { toast('That share link is damaged or incomplete'); }
  }
  render();
})();

</script>
</body>
